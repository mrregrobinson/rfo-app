<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robinson Family Office — Risk Management</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/chart.js@4.5.1/dist/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--teal:#2A7D7B;--gold:#C9A84C;--navy-l:#E8ECF3;--teal-l:#EAF4F4;--gold-l:#FDF6E3;--red-l:#FEE2E2;--amber-l:#FEF3C7;--green-l:#D1FAE5;--text:#1B2A4A;--muted:#6B7280;--border:#E5E7EB;--bg:#F9FAFB;--card:#fff;--r:10px;
  --low-fg:#065F46;--low-bg:#E8F8EF;--med-fg:#92400E;--med-bg:#FDF6E3;--high-fg:#9D174D;--high-bg:#FCE7F0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.nav{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:200;gap:16px}
.nav-brand{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:14px}
.nav-brand a{color:#fff;text-decoration:none}
.nav-brand span{color:var(--gold);font-size:11px}
.nav-user{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer}
.page{padding:20px;max-width:1080px;margin:0 auto}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn-gold{background:var(--gold);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:#fff;color:var(--navy);border:0.5px solid var(--border)}
.btn-danger{background:#fff;color:#991B1B;border:0.5px solid #F3D6D6}
.btn-sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:0.5px solid var(--border)}
.tab{padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;user-select:none}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chip-low{background:var(--low-bg);color:var(--low-fg)}
.chip-med{background:var(--med-bg);color:var(--med-fg)}
.chip-high{background:var(--high-bg);color:var(--high-fg)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--navy-l);color:var(--navy)}
.pill-incomplete{background:var(--high-bg);color:var(--high-fg)}
.pill-progress{background:var(--amber-l);color:#92400E}
.dgroup{margin-bottom:14px}
.dhead{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer}
.ddot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex-shrink:0}
.dtitle{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.4px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-top:0.5px solid var(--border);cursor:pointer}
.rrow:hover{background:var(--bg)}
.rnum{font-size:11px;font-weight:700;color:var(--muted);padding-top:2px}
.rtitle{font-size:13px;font-weight:600;color:var(--navy)}
.rdesc{font-size:11.5px;color:var(--muted);margin-top:2px}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rmeta .k{font-size:10.5px;color:var(--muted)}
.rright{display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:0.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;background:#fff}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--navy);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-input,.form-select,.form-textarea{width:100%;border:0.5px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px;color:var(--text);background:#fff;font-family:inherit;margin-bottom:12px}
.form-textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:760px;width:100%;max-height:calc(100vh - 48px);overflow-y:auto}
.modal-sm{max-width:460px}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.sec{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.3px;margin:16px 0 6px}
.line{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:0.5px dashed var(--border);font-size:12px}
.line:last-child{border-bottom:none}
.muted{color:var(--muted)}
.small{font-size:11px}
.alert{padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:12px;border:0.5px solid}
.alert-success{background:var(--green-l);border-color:#6EE7B7;color:#065F46}
.alert-danger{background:var(--red-l);border-color:#FCA5A5;color:#991B1B}
.alert-info{background:var(--navy-l);border-color:#C7D2FE;color:var(--navy)}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:12px}
.kcard .v{font-size:20px;font-weight:700;color:var(--navy)}
.kcard .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:0.5px solid var(--border)}
table.tbl td{padding:7px 8px;border-bottom:0.5px solid var(--border);vertical-align:top}
.scoresel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scoresel button{width:30px;height:30px;border-radius:7px;border:0.5px solid var(--border);background:#fff;font-weight:700;font-size:12px;cursor:pointer;color:var(--navy)}
.scoresel button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:600;font-size:11px;cursor:pointer;padding:0}
.back-link{display:inline-block;margin-bottom:12px;color:var(--teal);font-size:12px;cursor:pointer}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.rrow{grid-template-columns:22px 1fr}.rright{align-items:flex-start;margin-top:6px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const h=React.createElement;
const api={
  async get(url){const r=await fetch(url,{credentials:'same-origin'});if(r.status===401){const e=new Error('UNAUTHENTICATED');e.code=401;throw e;}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
  async send(method,url,body){const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(r.status===401){const e=new Error('UNAUTHENTICATED');e.code=401;throw e;}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
  post(url,body){return api.send('POST',url,body)},
  put(url,body){return api.send('PUT',url,body)},
  async del(url){const r=await fetch(url,{method:'DELETE',credentials:'same-origin'});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
};

// P×I scoring — mirrors server/risk.js scoreOf/bandOf exactly (fixed in code, §5.1).
const scoreOf=(p,i)=>(Number(p)||0)*(Number(i)||0);
const bandOf=s=>s<=5?'Low':s<=8?'Medium':'High';
const bandClass=b=>b==='Low'?'chip-low':b==='Medium'?'chip-med':'chip-high';
const QUARTERS=['','Q1 2026','Q2 2026','Q3 2026','Q4 2026','Q1 2027','Q2 2027','Q3 2027','Q4 2027'];
const STATUS_VALUES=['Active — Well Managed','Active — Partially Mitigated','In Progress','INCOMPLETE — Action Required'];
const PRIORITIES=['Immediate','Active','Monitor'];
const SEVERITIES=['Near miss','Minor','Moderate','Significant','Severe'];
function statusPill(s){
  const cls=s==='INCOMPLETE — Action Required'?'pill-incomplete':s==='In Progress'?'pill-progress':'pill';
  return h('span',{className:'pill '+cls},s);
}
function scoreChip(prob,impact,label){
  const sc=scoreOf(prob,impact);const b=bandOf(sc);
  return h('span',{className:'chip '+bandClass(b),title:label||''},`${prob}×${impact}=${sc} ${b}`);
}

// Draws the risk's number centred on each heatmap bubble so a point is identifiable
// without hovering. Points must carry `_n` (the risk number) in their data objects.
const bubbleNumberPlugin={
  id:'bubbleNumbers',
  afterDatasetsDraw(chart){
    const ctx=chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      const meta=chart.getDatasetMeta(di);
      meta.data.forEach((pt,i)=>{
        const raw=ds.data[i];
        if(!raw||raw._n==null)return;
        ctx.save();
        ctx.font='bold 9px -apple-system,BlinkMacSystemFont,Arial';
        ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(String(raw._n),pt.x,pt.y);
        ctx.restore();
      });
    });
  }
};

// ---------- Chart wrapper (from expenditure.html) ----------
function ChartCanvas({type,data,options,height,plugins}){
  const ref=useRef(null);const chartRef=useRef(null);
  // Force a fixed-height container + maintainAspectRatio:false — otherwise Chart.js's
  // responsive sizing grows the canvas to fill available width at its aspect ratio,
  // which on a wide page makes the chart absurdly tall (see expenditure.html's note).
  const opts=Object.assign({responsive:true,maintainAspectRatio:false},options||{});
  useEffect(()=>{
    if(!ref.current)return;
    if(chartRef.current&&chartRef.current.config.type===type){
      chartRef.current.data=data;chartRef.current.options=opts;chartRef.current.update();
    }else{
      if(chartRef.current)chartRef.current.destroy();
      chartRef.current=new Chart(ref.current,{type,data,options:opts,plugins:plugins||[]});
    }
  },[JSON.stringify(data),JSON.stringify(options),type]);
  useEffect(()=>()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}},[]);
  return h('div',{style:{position:'relative',height:(height||240)+'px',width:'100%'}},h('canvas',{ref}));
}

// =======================================================================
// Register tab
// =======================================================================
function RegisterTab({overview,members,me,roles,onReload,onOpenCategory}){
  const [basis,setBasis]=useState('residual');
  const [fDomain,setFDomain]=useState('');
  const [fStatus,setFStatus]=useState('');
  const [fBand,setFBand]=useState('');
  const [fAcc,setFAcc]=useState('');
  const [fFlags,setFFlags]=useState('');
  const [expandMits,setExpandMits]=useState({});
  const [showRetired,setShowRetired]=useState(false);
  const [addingCat,setAddingCat]=useState(false);

  const cats=overview.categories.filter(c=>showRetired||c.isActive);
  function matches(c){
    const a=c.latestAssessment;
    if(fDomain&&c.domainId!==fDomain)return false;
    if(fStatus&&(!a||a.status!==fStatus))return false;
    if(fBand){const b=a?(basis==='residual'?a.residualBand:a.inherentBand):null;if(b!==fBand)return false;}
    if(fAcc&&!((c.accountableName||c.accountable||'').toLowerCase().includes(fAcc.toLowerCase())))return false;
    if(fFlags==='review'){const nr=a&&a.nextReview;if(!nr)return false;}
    if(fFlags==='immediate'&&c.actionCounts.immediate===0)return false;
    return true;
  }
  const shown=cats.filter(matches);

  return h('div',null,
    h('div',{className:'filters'},
      h('div',{style:{display:'flex',border:'0.5px solid var(--border)',borderRadius:7,overflow:'hidden'}},
        ['residual','inherent'].map(bv=>h('div',{key:bv,onClick:()=>setBasis(bv),style:{padding:'6px 12px',fontSize:12,fontWeight:600,cursor:'pointer',background:basis===bv?'var(--navy)':'#fff',color:basis===bv?'#fff':'var(--navy)'}},bv[0].toUpperCase()+bv.slice(1)))),
      h('select',{value:fDomain,onChange:e=>setFDomain(e.target.value)},h('option',{value:''},'All domains'),overview.domains.map(d=>h('option',{key:d.id,value:d.id},d.id+' — '+d.name))),
      h('select',{value:fStatus,onChange:e=>setFStatus(e.target.value)},h('option',{value:''},'Any status'),STATUS_VALUES.map(s=>h('option',{key:s,value:s},s))),
      h('select',{value:fBand,onChange:e=>setFBand(e.target.value)},h('option',{value:''},'Any level'),['Low','Medium','High'].map(b=>h('option',{key:b,value:b},b))),
      h('input',{placeholder:'Accountable…',value:fAcc,onChange:e=>setFAcc(e.target.value),style:{width:130}}),
      h('select',{value:fFlags,onChange:e=>setFFlags(e.target.value)},h('option',{value:''},'—'),h('option',{value:'review'},'Has next review'),h('option',{value:'immediate'},'Open Immediate action')),
      h('label',{className:'small',style:{display:'inline-flex',alignItems:'center',gap:4}},h('input',{type:'checkbox',checked:showRetired,onChange:e=>setShowRetired(e.target.checked)}),'Show retired'),
      h('div',{style:{flex:1}}),
      roles.riskAdmin&&h('button',{className:'btn btn-outline btn-sm',onClick:()=>setAddingCat(true)},'+ Add risk'),
      h(ReportButtons,{filters:{domain:fDomain,status:fStatus,band:fBand,accountable:fAcc},members})
    ),
    addingCat&&h(AddCategoryModal,{domains:overview.domains,members,onClose:()=>setAddingCat(false),onDone:(newId)=>{setAddingCat(false);onReload().then(()=>onOpenCategory(newId));}}),
    overview.domains.map(d=>{
      const dcats=shown.filter(c=>c.domainId===d.id);
      if(!dcats.length)return null;
      const scores=dcats.map(c=>c.latestAssessment?(basis==='residual'?c.latestAssessment.residualScore:c.latestAssessment.inherentScore):0);
      const worst=Math.max(0,...scores);
      return h('div',{className:'card dgroup',key:d.id},
        h('div',{className:'dhead'},h('span',{className:'ddot'}),h('span',{className:'dtitle'},d.id+' — '+d.name),
          h('span',{className:'small muted',style:{marginLeft:'auto'}},`${dcats.length} risk${dcats.length>1?'s':''} · worst ${basis} ${worst} (${bandOf(worst)})`)),
        dcats.map(c=>{
          const a=c.latestAssessment;
          const mits=c.mitigations||[];
          const open=!!expandMits[c.id];
          return h('div',{key:c.id},
            h('div',{className:'rrow',style:{opacity:c.isActive?1:.5},onClick:()=>onOpenCategory(c.id)},
              h('div',{className:'rnum'},'#'+c.number),
              h('div',null,
                h('div',{className:'rtitle'},c.title,!c.isActive&&h('span',{className:'small muted',style:{fontWeight:400}},'  (retired)')),
                h('div',{className:'rdesc'},c.description),
                h('div',{className:'rmeta'},
                  a?statusPill(a.status):h('span',{className:'small muted'},'Not yet assessed'),
                  h('span',{className:'k'},'· '+(c.accountableName||c.accountable||'—')),
                  a&&a.nextReview&&h('span',{className:'k'},'· review '+a.nextReview),
                  c.actionCounts.open>0&&h('span',{className:'k'},'· '+c.actionCounts.open+' open action'+(c.actionCounts.open>1?'s':'')),
                  c.actionCounts.immediate>0&&h('span',{style:{color:'var(--high-fg)',fontWeight:700,fontSize:10.5}},'· '+c.actionCounts.immediate+' Immediate'),
                  c.events12mo>0&&h('span',{className:'k'},'· '+c.events12mo+' event'+(c.events12mo>1?'s':'')+'/12mo'),
                  mits.length>0&&h('span',{style:{cursor:'pointer',color:'var(--teal)',fontWeight:600,fontSize:10.5},onClick:e=>{e.stopPropagation();setExpandMits(m=>({...m,[c.id]:!m[c.id]}));}},'· '+(open?'▾':'▸')+' '+mits.length+' mitigation'+(mits.length>1?'s':''))
                )
              ),
              h('div',{className:'rright'},
                a&&h('div',null,h('span',{className:'small muted'},'Inh '),scoreChip(a.inherentProb,a.inherentImpact)),
                a&&h('div',null,h('span',{className:'small muted'},'Res '),scoreChip(a.residualProb,a.residualImpact)),
                !a&&h('span',{className:'small muted'},'—')
              )
            ),
            open&&h('div',{style:{padding:'6px 12px 12px 44px',borderTop:'0.5px dashed var(--border)',background:'#fff'}},
              h('div',{style:{fontSize:10.5,fontWeight:700,color:'var(--teal)',textTransform:'uppercase',letterSpacing:'.3px',margin:'6px 0 3px'}},'Key mitigations in place'),
              mits.map(m=>h('div',{key:m.id,className:'small',style:{padding:'2px 0',opacity:m.inPlace?1:.55}},'• '+m.text+(m.inPlace?'':' (planned)'))))
          );
        })
      );
    })
  );
}

// =======================================================================
// Category drawer — THE single place a risk is managed. One scrolling panel:
// scoring, why-it-was-scored, the inherent→residual mitigation steps, the
// actions (with per-action Family-Task-List sync), notes, events, history.
// No sub-tabs — every attribute of the risk is managed here together.
// =======================================================================
function CategoryDrawer({categoryId,members,me,roles,scale,domains,onClose,onChanged}){
  const [data,setData]=useState(null);
  const [err,setErr]=useState('');
  function load(){api.get('/api/risk/categories/'+categoryId).then(setData).catch(e=>setErr(e.message));}
  useEffect(load,[categoryId]);
  function refresh(){return api.get('/api/risk/categories/'+categoryId).then((d)=>{setData(d);onChanged&&onChanged();});}

  if(err)return h('div',{className:'modal-overlay',onClick:onClose},h('div',{className:'modal',onClick:e=>e.stopPropagation()},h('div',{className:'alert alert-danger'},err),h('button',{className:'btn btn-outline btn-sm',onClick:onClose},'Close')));
  if(!data)return h('div',{className:'modal-overlay',onClick:onClose},h('div',{className:'modal'},'Loading…'));
  const c=data.category;
  const latest=data.assessments[data.assessments.length-1];

  return h('div',{className:'modal-overlay',onClick:onClose},
    h('div',{className:'modal',onClick:e=>e.stopPropagation()},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',position:'sticky',top:'-22px',background:'#fff',paddingTop:2,zIndex:1}},
        h('div',null,
          h('div',{className:'modal-title'},'#'+c.number+'  '+c.title),
          h('div',{className:'modal-sub'},c.description)),
        h('button',{className:'btn btn-outline btn-sm',onClick:onClose},'Close')),
      latest&&h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:8}},
        h('span',null,h('span',{className:'small muted'},'Inherent '),scoreChip(latest.inherentProb,latest.inherentImpact)),
        h('span',{className:'small muted'},'→'),
        h('span',null,h('span',{className:'small muted'},'Residual '),scoreChip(latest.residualProb,latest.residualImpact)),
        statusPill(latest.status),
        latest.nextReview&&h('span',{className:'small muted'},'Next review '+latest.nextReview),
        !data.category.isActive&&h('span',{className:'pill pill-incomplete'},'RETIRED')),
      h(RiskPanel,{data,members,latest,scale,domains,roles,refresh})
    )
  );
}

// The one scrolling body — all of a risk's attributes managed side by side.
function RiskPanel({data,members,latest,scale,domains,roles,refresh}){
  const [reassessing,setReassessing]=useState(false);
  const [showHistory,setShowHistory]=useState(false);
  const [showEvents,setShowEvents]=useState(data.events.length>0);
  const c=data.category;
  const probScale=scale.filter(s=>s.kind==='probability');
  const impScale=scale.filter(s=>s.kind==='impact');
  return h('div',null,
    roles.riskMember&&h(RiskDetailsEditor,{category:c,domains,members,roles,refresh}),
    h('div',{className:'sec'},'Current scoring'),
    latest
      ? h('div',{className:'card',style:{background:'var(--bg)',marginBottom:4}},
          h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}},
            h('div',null,h('div',{className:'small muted'},'Inherent — before mitigations'),h('div',{style:{marginTop:2}},scoreChip(latest.inherentProb,latest.inherentImpact))),
            h('div',{style:{fontSize:20,color:'var(--muted)'}},'→'),
            h('div',null,h('div',{className:'small muted'},'Residual — after mitigations'),h('div',{style:{marginTop:2}},scoreChip(latest.residualProb,latest.residualImpact))),
            h('div',{style:{flex:1}}),
            statusPill(latest.status)),
          h('div',{className:'small muted',style:{marginTop:8}},'Assessed '+latest.assessedAt.slice(0,10)+' by '+(latest.assessedByName||'—')+(latest.nextReview?' · next review '+latest.nextReview:'')),
          roles.riskMember&&h('button',{className:'btn btn-gold btn-sm',style:{marginTop:10},onClick:()=>setReassessing(!reassessing)},reassessing?'Cancel re-assessment':'Re-assess scores'))
      : h('div',{className:'small muted',style:{marginBottom:8}},'Not yet assessed. ',roles.riskMember&&h('button',{className:'btn btn-gold btn-sm',onClick:()=>setReassessing(true)},'Assess now')),
    reassessing&&h('div',{className:'card',style:{marginTop:0}},h(AssessForm,{category:c,latest,probScale,impScale,roles,onSaved:()=>{setReassessing(false);refresh();}})),

    h(RationaleEditor,{assessment:latest,roles,refresh}),
    h(MitigationList,{data,roles,refresh}),

function AssessForm({category,latest,probScale,impScale,roles,onSaved}){

  const [status,setStatus]=useState(latest?latest.status:STATUS_VALUES[1]);
  const [rationale,setRationale]=useState(latest?latest.rationale:'');
  const [nextReview,setNextReview]=useState(latest?latest.nextReview||'':'');
  const [note,setNote]=useState('');
  const [lookup,setLookup]=useState(null);
  const [lookupState,setLookupState]=useState('idle');

        h('div',null,h('strong',null,'External base rate: '),lookup.probabilityLow!=null?`${Math.round(lookup.probabilityLow*100)}–${Math.round(lookup.probabilityHigh*100)}%/yr`:'not estimable',

      h('select',{className:'form-select',value:nextReview,onChange:e=>setNextReview(e.target.value)},QUARTERS.map(q=>h('option',{key:q,value:q},q||'No next review')))),

  useEffect(()=>{api.get('/api/risk/settings').then(setSettings);},[]);
  async function saveScale(){setSavingScale(true);try{await api.put('/api/risk/scale',{scale});onReload();}finally{setSavingScale(false);}}
  async function saveSettings(){await api.put('/api/risk/settings',settings);}
  return h('div',null,
    h('div',{className:'card'},
      h('div',{style:{display:'flex',justifyContent:'space-between'}},h('strong',null,'Roles'),h('button',{className:'btn btn-outline btn-sm',onClick:()=>setShowRoles(true)},'Manage roles')),
      h('div',{className:'small muted',style:{marginTop:4}},'Who can read the register (everyone with a role), record assessments/events (member+), and edit the taxonomy (admin).')),
    h('div',{className:'card'},
      h('strong',null,'Domains'),
      h('div',{className:'small muted',style:{marginTop:4,marginBottom:8}},'Rename a domain. To add, edit, retire or restore an individual risk, open it from the Register (use "+ Add risk" there, and "Show retired" to reach retired ones). Scoring is P×I with fixed bands (1–5 Low, 6–8 Medium, 9–16 High) — not editable.'),
      h(DomainNames,{overview,onReload})),
    h('div',{className:'card'},
      h('strong',null,'Scoring scale labels'),
      h('table',{className:'tbl',style:{marginTop:6}},h('thead',null,h('tr',null,['Kind','Score','Label','Detail'].map(x=>h('th',{key:x},x)))),
        h('tbody',null,scale.map((s,i)=>h('tr',{key:s.kind+s.score},
          h('td',null,s.kind),h('td',null,s.score),
          h('td',null,h('input',{className:'form-input',style:{marginBottom:0},value:s.label,onChange:e=>{const n=[...scale];n[i]={...s,label:e.target.value};setScale(n);}})),
          h('td',null,h('input',{className:'form-input',style:{marginBottom:0},value:s.detail,onChange:e=>{const n=[...scale];n[i]={...s,detail:e.target.value};setScale(n);}})))))),
      h('button',{className:'btn btn-teal btn-sm',style:{marginTop:8},disabled:savingScale,onClick:saveScale},savingScale?'Saving…':'Save scale')),
    settings&&h('div',{className:'card'},
      h('strong',null,'Quarterly review reminder'),
      h('div',{className:'small muted',style:{marginTop:4,marginBottom:8}},'Stored for the phase-2 email reminder (categories past their next-review quarter, incomplete statuses, overdue Immediate actions).'),
      h('label',{className:'small',style:{display:'block',marginBottom:8}},h('input',{type:'checkbox',checked:settings.reviewEnabled,onChange:e=>setSettings({...settings,reviewEnabled:e.target.checked})}),' Enable reminder'),
      h('div',{className:'grid2'},
        h('select',{className:'form-select',value:settings.reviewCadence,onChange:e=>setSettings({...settings,reviewCadence:e.target.value})},['weekly','monthly','quarterly'].map(c=>h('option',{key:c,value:c},c))),
        h('input',{className:'form-input',type:'number',min:0,max:23,value:settings.reviewHourLocal,onChange:e=>setSettings({...settings,reviewHourLocal:Number(e.target.value)})})),
      h('button',{className:'btn btn-teal btn-sm',onClick:saveSettings},'Save reminder settings')),
    showRoles&&h(RolesModal,{members,onClose:()=>setShowRoles(false),onReload})
  );
}

function DomainNames({overview,onReload}){
  const [adding,setAdding]=useState(false);
  const [newName,setNewName]=useState('');
  const [busy,setBusy]=useState(false);const [err,setErr]=useState('');
  async function renameDomain(d){const name=prompt('Rename domain '+d.id,d.name);if(name&&name!==d.name){await api.put('/api/risk/domains/'+d.id,{name});onReload();}}
  async function addDomain(){
    if(!newName.trim())return;
    setBusy(true);setErr('');
    try{await api.post('/api/risk/domains',{name:newName.trim()});setNewName('');setAdding(false);onReload();}
    catch(e){setErr(e.message);}finally{setBusy(false);}
  }
  return h('div',null,
    overview.domains.map(d=>h('div',{className:'line',key:d.id},
      h('span',{className:'dtitle'},d.id+' — '+d.name),
      h('button',{className:'linkbtn',onClick:()=>renameDomain(d)},'rename'))),
    err&&h('div',{className:'alert alert-danger',style:{marginTop:8}},err),
    !adding&&h('button',{className:'btn btn-outline btn-sm',style:{marginTop:8},onClick:()=>setAdding(true)},'+ Add domain'),
    adding&&h('div',{style:{display:'flex',gap:6,marginTop:8}},
      h('input',{className:'form-input',style:{marginBottom:0},placeholder:'New domain name (id auto-assigned)',value:newName,onChange:e=>setNewName(e.target.value),onKeyDown:e=>{if(e.key==='Enter')addDomain();}}),
      h('button',{className:'btn btn-teal btn-sm',disabled:busy,onClick:addDomain},busy?'Adding…':'Add'),
      h('button',{className:'btn btn-outline btn-sm',onClick:()=>{setAdding(false);setNewName('');setErr('');}},'Cancel'))
  );
}

function AddCategoryModal({domains,members,onClose,onDone}){
  const [f,setF]=useState({domainId:domains[0].id,title:'',description:'',accountableUserId:''});
  const [busy,setBusy]=useState(false);const [err,setErr]=useState('');
  async function go(){
    if(!f.title.trim()||!f.description.trim()){setErr('Title and description are required.');return;}
    setBusy(true);setErr('');
    try{const r=await api.post('/api/risk/categories',f);onDone(r.id);}
    catch(e){setErr(e.message);setBusy(false);}
  }
  return h('div',{className:'modal-overlay',onClick:onClose},h('div',{className:'modal modal-sm',onClick:e=>e.stopPropagation()},
    h('div',{className:'modal-title'},'Add a risk category'),
    h('div',{className:'modal-sub'},'It enters the register unassessed — open it and run the first assessment.'),
    err&&h('div',{className:'alert alert-danger'},err),
    h('label',{className:'form-label'},'Domain'),
    h('select',{className:'form-select',value:f.domainId,onChange:e=>setF({...f,domainId:e.target.value})},domains.map(d=>h('option',{key:d.id,value:d.id},d.id+' — '+d.name))),
    h('label',{className:'form-label'},'Title'),h('input',{className:'form-input',value:f.title,onChange:e=>setF({...f,title:e.target.value})}),
    h('label',{className:'form-label'},'One-line description'),h('input',{className:'form-input',value:f.description,onChange:e=>setF({...f,description:e.target.value})}),
    h('label',{className:'form-label'},'Accountable — one family member'),
    h('select',{className:'form-select',value:f.accountableUserId,onChange:e=>setF({...f,accountableUserId:e.target.value})},
      h('option',{value:''},'— not assigned —'),
      (members||[]).map(m=>h('option',{key:m.id,value:m.id},m.name))),
    h('div',{style:{display:'flex',gap:6,marginTop:8}},
      h('button',{className:'btn btn-teal btn-sm',disabled:busy,onClick:go},busy?'Adding…':'Add risk'),
      h('button',{className:'btn btn-outline btn-sm',onClick:onClose},'Cancel'))
  ));
}

function RolesModal({members,onClose,onReload}){
  const [busy,setBusy]=useState(null);
  async function setRole(m,role){setBusy(m.id);try{await api.put('/api/admin/members/'+m.id+'/app-role',{app:'risk',role});onReload&&onReload();}catch(e){alert(e.message);}finally{setBusy(null);}}
  return h('div',{className:'modal-overlay',onClick:onClose},h('div',{className:'modal modal-sm',onClick:e=>e.stopPropagation()},
    h('div',{className:'modal-title'},'Risk Management roles'),
    members.filter(m=>m.isActive!==false).map(m=>h('div',{key:m.id,style:{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'0.5px solid var(--border)'}},
      h('span',{style:{flex:1,fontSize:13}},m.name),
      h('select',{value:m.riskRole,disabled:busy===m.id,onChange:e=>setRole(m,e.target.value)},
        ['admin','member','viewer'].map(r=>h('option',{key:r,value:r},r[0].toUpperCase()+r.slice(1)))))),
    h('div',{style:{textAlign:'right',marginTop:14}},h('button',{className:'btn btn-outline btn-sm',onClick:onClose},'Close'))
  ));
}

function ReportButtons({filters,members}){
  const [emailing,setEmailing]=useState(false);const [to,setTo]=useState('');const [msg,setMsg]=useState('');
  function qs(){const q=new URLSearchParams();Object.entries(filters||{}).forEach(([k,v])=>{if(v)q.set(k,v);});return q.toString();}
  async function sendEmail(){
    setMsg('');
    try{await api.post('/api/risk/report/email',{to:to.split(',').map(s=>s.trim()).filter(Boolean),filters});setMsg('Sent.');setEmailing(false);}
    catch(e){setMsg(e.message);}
  }
  return h('span',{style:{display:'inline-flex',gap:6,alignItems:'center'}},
    h('a',{className:'btn btn-outline btn-sm',href:'/api/risk/report/pdf?'+qs(),target:'_blank'},'Print / PDF'),
    h('button',{className:'btn btn-outline btn-sm',onClick:()=>setEmailing(!emailing)},'Email PDF'),
    emailing&&h('span',null,h('input',{placeholder:'email addresses, comma-separated',value:to,onChange:e=>setTo(e.target.value),style:{width:220}}),
      h('button',{className:'btn btn-teal btn-sm',style:{marginLeft:4},onClick:sendEmail},'Send')),
    msg&&h('span',{className:'small muted'},msg)
  );
}

// =======================================================================
// Shell
// =======================================================================
function RiskApp({me,roles}){
  const [overview,setOverview]=useState(null);
  const [members,setMembers]=useState([]);
  const [tab,setTab]=useState('register');
  const [err,setErr]=useState('');
  const [openCat,setOpenCat]=useState(null); // the one risk drawer, openable from any tab
  function load(){
    return Promise.all([api.get('/api/risk/overview'),api.get('/api/members')])
      .then(([o,m])=>{setOverview(o);setMembers(m.filter(x=>x.isActive!==false));})
      .catch(e=>setErr(e.message));
  }
  useEffect(()=>{load();},[]);
  if(err)return h('div',{className:'page'},h('div',{className:'alert alert-danger'},err));
  if(!overview)return h('div',{className:'page'},'Loading…');
  const TABS=[['register','Register'],['profile','Profile'],['events','Events']];
  if(roles.riskAdmin)TABS.push(['manage','Manage']);
  return h('div',{className:'page'},
    h('div',{style:{marginBottom:12}},
      h('div',{style:{fontSize:18,fontWeight:700,color:'var(--navy)'}},'Risk Management'),
      h('div',{className:'small muted'},'Robinson Family Office — Enterprise Risk Register'+(roles.riskMember?'':' · read-only'))),
    h('div',{className:'tabs'},TABS.map(([k,l])=>h('div',{key:k,className:'tab'+(tab===k?' active':''),onClick:()=>setTab(k)},l))),
    tab==='register'&&h(RegisterTab,{overview,members,me,roles,onReload:load,onOpenCategory:setOpenCat}),
    tab==='profile'&&h(ProfileTab,{overview,roles,onOpenCategory:setOpenCat}),
    tab==='events'&&h(EventsTab,{overview,roles}),
    tab==='manage'&&roles.riskAdmin&&h(ManageTab,{overview,members,onReload:load}),
    openCat&&h(CategoryDrawer,{categoryId:openCat,members,me,roles,scale:overview.scale,domains:overview.domains,onClose:()=>setOpenCat(null),onChanged:load})
  );
}

function Shell(){
  const [me,setMe]=useState(null);const [checking,setChecking]=useState(true);const [menu,setMenu]=useState(false);
  useEffect(()=>{
    api.get('/api/me').then(setMe).catch(()=>{location.href='/due-diligence?returnTo='+encodeURIComponent(location.pathname);}).finally(()=>setChecking(false));
  },[]);
  async function logout(){await api.post('/api/logout');location.href='/due-diligence';}
  if(checking||!me)return h('div',{style:{padding:40,textAlign:'center',color:'var(--muted)'}},'Loading…');
  const roles={riskAdmin:me.riskAdmin,riskMember:me.riskAdmin||me.riskRole==='member',tasksMember:me.tasksAdmin||me.tasksRole==='member',tasksAdmin:me.tasksAdmin};
  return h('div',null,
    h('nav',{className:'nav'},
      h('div',{className:'nav-brand'},h('a',{href:'/'},'Robinson Family Office'),h('span',null,'Risk Management'),
        h('a',{href:'/tasks',style:{color:'rgba(255,255,255,.75)',fontSize:11,marginLeft:14,textDecoration:'none'}},'Family Task List →')),
      h('div',{className:'nav-user',onClick:()=>setMenu(!menu)},me.name.split(' ')[0])),
    menu&&h('div',{style:{position:'fixed',top:56,right:16,background:'#fff',border:'0.5px solid var(--border)',borderRadius:10,padding:8,zIndex:400,minWidth:180,boxShadow:'0 4px 20px rgba(0,0,0,.12)'}},
      h('div',{style:{padding:'8px 10px',fontSize:13,fontWeight:600,color:'var(--navy)'}},me.name),
      h('div',{style:{padding:'0 10px 8px',fontSize:11,color:'var(--muted)'}},roles.riskAdmin?'Risk Admin':roles.riskMember?'Risk Member':'Read-only'),
      me.isAdmin&&h('a',{href:'/admin',style:{display:'block',borderTop:'0.5px solid var(--border)',padding:'8px 10px',fontSize:12,color:'var(--navy)',fontWeight:600,textDecoration:'none'}},'Manage Members'),
      h('div',{style:{padding:'8px 10px',cursor:'pointer',fontSize:12,color:'#991B1B',fontWeight:600},onClick:logout},'Sign out')),
    h(RiskApp,{me,roles})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Shell));
</script>
