<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robinson Family Office</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--teal:#2A7D7B;--gold:#C9A84C;--navy-l:#E8ECF3;--teal-l:#EAF4F4;--gold-l:#FDF6E3;--muted:#6B7280;--border:#E5E7EB;--bg:#F9FAFB;--card:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}
.nav{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.nav-brand{color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:800;letter-spacing:.4px;margin-right:10px}
.nav-user{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:background .15s}
.nav-user:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:1040px;margin:0 auto;padding:44px 24px 60px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--muted);margin-bottom:36px}
.group{margin-bottom:32px}
.group-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.group-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.group-label{font-size:13px;font-weight:700;letter-spacing:.2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(16,24,40,.03);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,42,74,.08)}
.tile-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.tile-icon svg{width:21px;height:21px}
.tile-title{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:6px}
.tile-desc{font-size:12px;color:var(--muted);line-height:1.6}
.loading{padding:48px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>
<script>
const api = {
  async get(url) {
    const r = await fetch(url, { credentials: 'same-origin' });
    if (r.status === 401) { const e = new Error('UNAUTHENTICATED'); e.code = 401; throw e; }
    if (!r.ok) throw new Error('Request failed');
    return r.json();
  },
};

// Minimal 24x24 stroke icons, one per application — purely decorative, so an icon
// that's a reasonable approximation of the app's purpose is enough; exact fidelity
// to any particular icon set doesn't matter here.
const ICONS = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
  checklist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8H6a3 3 0 000 6h1"/><path d="M3 8V7a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H6a3 3 0 01-3-3V8z"/><circle cx="16" cy="14" r="1.2"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 21v-1.5a6 6 0 0112 0V21"/><circle cx="19" cy="6" r="2"/></svg>',
};

// Mirrors the family office's own org chart (Strategic / People / Investing / Legacy /
// Operational Services, plus Governance for the office's own internal administration) —
// each application lives under whichever of those it actually serves, colour-coded to
// match. A future application slots into whichever group's `tiles` array it belongs to;
// a wholly new group is one more entry in GROUPS.
const GROUPS = [
  {
    key: 'investing', label: 'Investing Services', color: '#2E75B6', tint: '#EAF2FA',
    tiles: [
      { href: '/due-diligence', title: 'PQ Introduced Due Diligence', desc: 'Review investment opportunities Prime Quadrant has introduced, complete the IC checklist, and track decisions.', icon: ICONS.search },
    ],
  },
  {
    key: 'operational', label: 'Operational Services', color: '#1E9E5A', tint: '#E8F8EF',
    tiles: [], // Household Expenditures, pushed in once ledger membership is confirmed
  },
  {
    key: 'governance', label: 'Governance', color: '#1B2A4A', tint: '#E8ECF3',
    tiles: [
      { href: '/meetings', title: 'Family Office Meetings', desc: 'Schedule meetings with an agenda, send calendar invitations to family attendees, and record minutes.', icon: ICONS.calendar },
      { href: '/tasks', title: 'Family Task List', desc: 'Shared, prioritized task tracker across Strategy, People, Core Business, and Operations.', icon: ICONS.checklist },
    ], // Manage Members, pushed in for admins
  },
];

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

function tileHtml(t, group) {
  return `
        <a class="tile" href="${t.href}">
          <div class="tile-icon" style="background:${group.tint};color:${group.color}">${t.icon}</div>
          <div class="tile-title">${t.title}</div>
          <div class="tile-desc">${t.desc}</div>
        </a>`;
}

function groupHtml(group) {
  if (group.tiles.length === 0) return '';
  return `
      <div class="group">
        <div class="group-header">
          <span class="group-dot" style="background:${group.color}"></span>
          <span class="group-label" style="color:${group.color}">${group.label}</span>
        </div>
        <div class="tiles">${group.tiles.map((t) => tileHtml(t, group)).join('')}</div>
      </div>`;
}

async function init() {
  let user;
  try {
    user = await api.get('/api/me');
  } catch (err) {
    // No shared login page yet at "/" — the Due Diligence app's Login screen is reused
    // for both apps (Section 3.2 assumption); send unauthenticated visitors there.
    location.href = '/due-diligence?returnTo=' + encodeURIComponent('/');
    return;
  }

  const operational = GROUPS.find((g) => g.key === 'operational');
  const governance = GROUPS.find((g) => g.key === 'governance');
  // Household Expenditures isn't a per-app role like the other tiles — it's
  // partitioned into ledgers (see migration 023), so whether to show this tile at all
  // depends on ledger membership, checked separately rather than via user.* flags.
  // is_fo_admin does NOT imply membership here, unlike every other tile on this page.
  try {
    await api.get('/api/expenditure/ledger');
    operational.tiles.push({ href: '/expenditure', title: 'Household Expenditures', desc: 'Track household spending from bank and credit card statements, by category and time period.', icon: ICONS.wallet });
  } catch (err) { /* not a member of any expenditure ledger — tile stays hidden */ }
  if (user.isAdmin) {
    governance.tiles.push({ href: '/admin', title: 'Manage Members', desc: 'Family Office administration — add or deactivate members, set admin access and app-level roles, reset logins.', icon: ICONS.admin });
  }

  const firstName = user.name.split(' ')[0];
  document.getElementById('root').innerHTML = `
    <nav class="nav">
      <div class="nav-brand"><span class="brand-mark">RFO</span>Robinson Family Office</div>
      <div class="nav-user" id="signout">${firstName} · Sign out</div>
    </nav>
    <div class="wrap">
      <div class="eyebrow">Robinson Family Office</div>
      <div class="h1">${greeting()}, ${firstName}</div>
      <div class="sub">Choose an application below.</div>
      ${GROUPS.map(groupHtml).join('')}
    </div>
  `;
  document.getElementById('signout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
    location.href = '/due-diligence';
  });
}
init();
</script>
</body>
</html>
