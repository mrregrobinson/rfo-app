<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robinson Family Office — Maturity Assessment</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/chart.js@4.5.1/dist/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--teal:#2A7D7B;--gold:#C9A84C;--navy-l:#E8ECF3;--teal-l:#EAF4F4;--gold-l:#FDF6E3;--red-l:#FEE2E2;--amber-l:#FEF3C7;--green-l:#D1FAE5;--text:#1B2A4A;--muted:#6B7280;--border:#E5E7EB;--bg:#F9FAFB;--card:#fff;--r:10px;
  --l1-fg:#9D174D;--l1-bg:#FCE7F0;--l2-fg:#92400E;--l2-bg:#FEF3C7;--l3-fg:#1E3A8A;--l3-bg:#E8ECF3;--l4-fg:#0F766E;--l4-bg:#EAF4F4;--l5-fg:#065F46;--l5-bg:#E8F8EF}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.nav{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:200;gap:16px}
.nav-brand{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:14px}
.nav-brand a{color:#fff;text-decoration:none}
.nav-brand span{color:var(--gold);font-size:11px}
.nav-user{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer}
.page{padding:20px;max-width:1120px;margin:0 auto}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn-gold{background:var(--gold);color:#fff}.btn-teal{background:var(--teal);color:#fff}.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:#fff;color:var(--navy);border:0.5px solid var(--border)}
.btn-danger{background:#fff;color:#991B1B;border:0.5px solid #F3D6D6}
.btn-sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:0.5px solid var(--border)}
.tab{padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;user-select:none}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chip-l1{background:var(--l1-bg);color:var(--l1-fg)}.chip-l2{background:var(--l2-bg);color:var(--l2-fg)}
.chip-l3{background:var(--l3-bg);color:var(--l3-fg)}.chip-l4{background:var(--l4-bg);color:var(--l4-fg)}
.chip-l5{background:var(--l5-bg);color:var(--l5-fg)}.chip-none{background:var(--bg);color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--navy-l);color:var(--navy)}
.pill-draft{background:var(--gold-l);color:#92400E}.pill-open{background:var(--green-l);color:#065F46}.pill-closed{background:var(--navy-l);color:var(--navy)}
.dgroup{margin-bottom:14px}
.dhead{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer}
.ddot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex-shrink:0}
.dtitle{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.4px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-top:0.5px solid var(--border);cursor:pointer}
.rrow:hover{background:var(--bg)}
.rnum{font-size:11px;font-weight:700;color:var(--muted);padding-top:2px}
.rtitle{font-size:13px;font-weight:600;color:var(--navy)}
.rdesc{font-size:11.5px;color:var(--muted);margin-top:2px}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rmeta .k{font-size:10.5px;color:var(--muted)}
.rright{display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:0.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;background:#fff}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--navy);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-input,.form-select,.form-textarea{width:100%;border:0.5px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px;color:var(--text);background:#fff;font-family:inherit;margin-bottom:12px}
.form-textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:820px;width:100%;max-height:calc(100vh - 48px);overflow-y:auto}
.modal-sm{max-width:460px}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.sec{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.3px;margin:18px 0 6px}
.line{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:0.5px dashed var(--border);font-size:12px}
.line:last-child{border-bottom:none}
.muted{color:var(--muted)}.small{font-size:11px}
.alert{padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:12px;border:0.5px solid}
.alert-success{background:var(--green-l);border-color:#6EE7B7;color:#065F46}
.alert-danger{background:var(--red-l);border-color:#FCA5A5;color:#991B1B}
.alert-info{background:var(--navy-l);border-color:#C7D2FE;color:var(--navy)}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:12px}
.kcard .v{font-size:20px;font-weight:700;color:var(--navy)}
.kcard .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:0.5px solid var(--border)}
table.tbl td{padding:7px 8px;border-bottom:0.5px solid var(--border);vertical-align:top}
.scoresel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scoresel button{min-width:30px;height:30px;padding:0 6px;border-radius:7px;border:0.5px solid var(--border);background:#fff;font-weight:700;font-size:12px;cursor:pointer;color:var(--navy)}
.scoresel button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:600;font-size:11px;cursor:pointer;padding:0}
.pickrow{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:0.5px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:12px}
.pickrow.on{border-color:var(--navy);background:var(--navy-l)}
.pickrow .pn{font-weight:700;color:var(--muted);flex-shrink:0}
.track{position:relative;height:34px;border-radius:8px;background:linear-gradient(90deg,var(--l1-bg),var(--gold-l),var(--l5-bg));margin:6px 0}
.track .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.track .cog{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.rrow{grid-template-columns:22px 1fr}.rright{align-items:flex-start;margin-top:6px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const h=React.createElement;
const api={
  async get(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){const e=new Error('UNAUTHENTICATED');e.code=401;throw e;}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
  async send(m,u,b){const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});if(r.status===401){const e=new Error('UNAUTHENTICATED');e.code=401;throw e;}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
  post(u,b){return api.send('POST',u,b)},put(u,b){return api.send('PUT',u,b)},
  async del(u){const r=await fetch(u,{method:'DELETE',credentials:'same-origin'});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
};

// mirrors server/maturity.js levelClass / levelRollup.
function levelClass(n){n=Number(n);if(!isFinite(n))return 'none';if(n<2)return 'l1';if(n<3)return 'l2';if(n<4)return 'l3';if(n<5)return 'l4';return 'l5';}
function rollup(answers,questions){
  const w=new Map(questions.map(q=>[q.id,Number(q.weight)||1]));
  let s=0,tw=0;
  for(const a of answers){if(!w.has(a.questionId))continue;const v=Number(a.value);if(!isFinite(v))continue;const ww=w.get(a.questionId);s+=v*ww;tw+=ww;}
  if(!tw)return null;
  return Math.max(1,Math.min(5,Math.round((s/tw)*2)/2));
}
function levelChip(level,extra){
  if(level==null)return h('span',{className:'chip chip-none'},'—');
  return h('span',{className:'chip chip-'+levelClass(level),title:extra||''},Number(level).toFixed(1).replace(/\.0$/,''));
}
// Claude's benchmark recommendation on whether pursuing improvement here is worth it —
// same vocabulary as action priorities (Immediate/Active/Monitor), plus Maintain for
// "already appropriate for a family office this size, don't invest further right now".
function priorityChip(p){
  const cls={Immediate:'l1',Active:'l2',Monitor:'l4',Maintain:'l5'}[p]||'l4';
  return h('span',{className:'chip chip-'+cls},p);
}
const AGREE=['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];
const QUARTERS=['','Q1 2026','Q2 2026','Q3 2026','Q4 2026','Q1 2027','Q2 2027','Q3 2027','Q4 2027'];
const PRIORITIES=['Immediate','Active','Monitor'];

function ChartCanvas({type,data,options,height,plugins}){
  const ref=useRef(null);const chartRef=useRef(null);
  const opts=Object.assign({responsive:true,maintainAspectRatio:false},options||{});
  useEffect(()=>{
    if(!ref.current)return;
    if(chartRef.current&&chartRef.current.config.type===type){chartRef.current.data=data;chartRef.current.options=opts;chartRef.current.update();}
    else{if(chartRef.current)chartRef.current.destroy();chartRef.current=new Chart(ref.current,{type,data,options:opts,plugins:plugins||[]});}
  },[JSON.stringify(data),JSON.stringify(options),type]);
  useEffect(()=>()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}},[]);
  return h('div',{style:{position:'relative',height:(height||260)+'px',width:'100%'}},h('canvas',{ref}));
}

// =====================================================================
// Assessment tab
// =====================================================================
function AssessmentTab({data,me,roles,onReload}){
  const round=data.round;
  if(!round||round.status!=='open'){
    return h('div',{className:'card'},
      h('div',{className:'muted'},round&&round.status==='draft'
        ?'The next round is being set up. It will open for assessment shortly.'
        :'No assessment round is open. An administrator opens one from the Manage tab.'));
  }
  return h('div',null,
    h(AssessmentProgress,{round}),
    h('div',{className:'sec'},'One worksheet per service — how well it is run, 1–5'),
    data.groups.map(g=>{
      const svcs=data.services.filter(s=>s.groupId===g.id);
      if(!svcs.length)return null;
      return h('div',{className:'card dgroup',key:g.id},
        h('div',{className:'dhead'},h('span',{className:'ddot'}),h('span',{className:'dtitle'},g.name)),
        svcs.map(s=>h(ServiceWorksheet,{key:s.id,service:s,round,levelLabels:data.levelLabels,onReload})));
    })
  );
}
function AssessmentProgress({round}){
  return h('div',{className:'card'},
    h('div',{style:{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}},
      h('div',null,h('b',null,round.label),' ',h('span',{className:'pill pill-open'},'open')),
      h('div',{className:'small muted'},'For each service: answer the questions, then Submit. Also visit the Capital Consciousness tab once this round — it\'s answered for the family as a whole, not per service.')),
    (round.completion||[]).length?h('table',{className:'tbl',style:{marginTop:8}},
      h('thead',null,h('tr',null,h('th',null,'Member'),h('th',null,'Services submitted'),h('th',null,''))),
      h('tbody',null,round.completion.map(c=>h('tr',{key:c.userId},
        h('td',null,c.name+(c.me?' (you)':'')),
        h('td',null,c.servicesDone+' / '+c.servicesTotal),
        h('td',null,c.complete?h('span',{className:'chip chip-l5'},'complete'):h('span',{className:'small muted'},'in progress')))))
    ):null);
}
// colours for the 1–7 Capital Consciousness scale (used on the CC tab)
function ccClass(n){n=Number(n);if(!isFinite(n))return 'none';if(n<=2)return 'l1';if(n===3)return 'l2';if(n===4)return 'l3';if(n<=5)return 'l4';return 'l5';}
function ccChip(level,levels){
  if(level==null)return h('span',{className:'chip chip-none'},'—');
  const nm=(levels||[]).find(l=>l.level===Math.round(level));
  return h('span',{className:'chip chip-'+ccClass(level),title:nm?nm.description:''},'L'+level+(nm?' '+nm.name:''));
}
const svg=(tag,props,...kids)=>h(tag,props,...kids);

// ---- Grouped lollipop: one row per service, maturity 1–5 axis. Family mean dot,
// Claude-benchmark diamond, and a faint band for the member min–max spread. Replaces
// the radar. ----
function LollipopChart({groups,services,onOpen}){
  const W=680, LX=196, RX=W-18, RH=21, PAD_TOP=34, PAD_BOT=10;
  const rows=[]; // {type:'group'|'svc', ...}
  groups.forEach(g=>{
    const svcs=services.filter(s=>s.groupId===g.id);
    if(!svcs.length)return;
    rows.push({type:'group',name:g.name});
    svcs.forEach(s=>rows.push({type:'svc',s}));
  });
  const H=PAD_TOP+rows.length*RH+PAD_BOT;
  const x=v=>LX+((Math.max(1,Math.min(5,v))-1)/4)*(RX-LX);
  let y=PAD_TOP;
  const els=[];
  // gridlines + axis labels
  for(let v=1;v<=5;v++){
    els.push(svg('line',{key:'g'+v,x1:x(v),y1:PAD_TOP-6,x2:x(v),y2:H-PAD_BOT,stroke:'#EEF0F3',strokeWidth:1}));
    els.push(svg('text',{key:'gl'+v,x:x(v),y:PAD_TOP-12,textAnchor:'middle',fontSize:9,fill:'#9CA3AF'},v));
  }
  els.push(svg('text',{key:'lgd',x:LX,y:12,fontSize:9,fill:'#6B7280'},'● family mean   ▲ Claude’s read of us   ◆ peer benchmark   ▭ member spread'));
  rows.forEach((r,i)=>{
    const cy=y+RH/2;
    if(r.type==='group'){
      els.push(svg('text',{key:'gr'+i,x:8,y:cy+3,fontSize:9.5,fontWeight:700,fill:'#2A7D7B',style:{textTransform:'uppercase',letterSpacing:'.4px'}},r.name));
    }else{
      const s=r.s, st=s.stats||{};
      els.push(svg('text',{key:'n'+i,x:8,y:cy+3,fontSize:10,fill:'#1B2A4A',style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(s.id)},('#'+s.number+' '+s.name).slice(0,34)));
      els.push(svg('line',{key:'t'+i,x1:LX,y1:cy,x2:RX,y2:cy,stroke:'#EDEFF2',strokeWidth:5,strokeLinecap:'round'}));
      if(st.mean==null){
        els.push(svg('text',{key:'na'+i,x:LX+8,y:cy+3,fontSize:9,fill:'#9CA3AF'},'not assessed this round'));
      }else{
        if(st.min!=null&&st.max!=null&&st.max>st.min){
          els.push(svg('rect',{key:'sp'+i,x:x(st.min),y:cy-3,width:Math.max(2,x(st.max)-x(st.min)),height:6,rx:3,fill:'rgba(27,42,74,.14)'}));
        }
        if(s.benchmark&&s.benchmark.peerLevel!=null){
          const bx=x(s.benchmark.peerLevel);
          els.push(svg('rect',{key:'bm'+i,x:bx-4.5,y:cy-4.5,width:9,height:9,transform:'rotate(45 '+bx+' '+cy+')',fill:'#fff',stroke:'#C9A84C',strokeWidth:1.6}));
        }
        if(s.benchmark&&s.benchmark.assessedLevel!=null){
          const ax=x(s.benchmark.assessedLevel);
          els.push(svg('polygon',{key:'as'+i,points:(ax-5)+','+(cy+4)+' '+(ax+5)+','+(cy+4)+' '+ax+','+(cy-5),fill:'#fff',stroke:'#2A7D7B',strokeWidth:1.6}));
        }
        els.push(svg('circle',{key:'m'+i,cx:x(st.mean),cy:cy,r:5,fill:'#1B2A4A',stroke:'#fff',strokeWidth:1.5,style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(s.id)}));
        els.push(svg('text',{key:'mv'+i,x:Math.min(RX,x(st.mean)+9),y:cy-7,fontSize:8.5,fill:'#6B7280'},st.mean));
      }
    }
    y+=RH;
  });
  return svg('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',maxWidth:W+'px',height:'auto',display:'block'}},els);
}

// ---- Slopegraph: previous round -> this round, one line per service assessed this
// round, coloured by direction. Right-side labels are nudged apart to avoid overlap. ----
function Slopegraph({rows,onOpen}){
  const items=(rows||[]).filter(r=>r.familyMean!=null).map(r=>({...r}));
  if(!items.length)return h('div',{className:'small muted'},'Nothing assessed this round yet.');
  const W=560, XP=150, XN=360, LBLX=372, TOP=26, BOT=20, H=Math.max(220,items.length*13+TOP+BOT);
  const y=v=>TOP+((5-Math.max(1,Math.min(5,v)))/4)*(H-TOP-BOT);
  const els=[];
  for(let v=1;v<=5;v++){
    els.push(svg('line',{key:'g'+v,x1:XP,y1:y(v),x2:XN,y2:y(v),stroke:'#EEF0F3',strokeWidth:1}));
    els.push(svg('text',{key:'gl'+v,x:XP-10,y:y(v)+3,textAnchor:'end',fontSize:9,fill:'#9CA3AF'},v));
  }
  els.push(svg('text',{key:'hp',x:XP,y:14,textAnchor:'middle',fontSize:9.5,fontWeight:700,fill:'#6B7280'},'Previous round'));
  els.push(svg('text',{key:'hn',x:XN,y:14,textAnchor:'middle',fontSize:9.5,fontWeight:700,fill:'#6B7280'},'This round'));
  // anti-collision label layout, sorted by this-round value
  const sorted=items.slice().sort((a,b)=>b.familyMean-a.familyMean);
  let last=-99; const gap=11;
  sorted.forEach(it=>{ let ly=y(it.familyMean); if(ly<last+gap)ly=last+gap; it._ly=ly; last=ly; });
  sorted.forEach((it,i)=>{
    const col=it.prevMean==null?'#9CA3AF':(it.familyMean>it.prevMean?'#0F766E':it.familyMean<it.prevMean?'#B91C1C':'#9CA3AF');
    if(it.prevMean!=null){
      els.push(svg('line',{key:'l'+i,x1:XP,y1:y(it.prevMean),x2:XN,y2:y(it.familyMean),stroke:col,strokeWidth:1.5,opacity:.85}));
      els.push(svg('circle',{key:'p'+i,cx:XP,cy:y(it.prevMean),r:2.6,fill:col}));
    }
    els.push(svg('circle',{key:'n'+i,cx:XN,cy:y(it.familyMean),r:3.2,fill:col,style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(it.serviceId)}));
    els.push(svg('line',{key:'ll'+i,x1:XN+4,y1:y(it.familyMean),x2:LBLX-2,y2:it._ly,stroke:'#E5E7EB',strokeWidth:1}));
    els.push(svg('text',{key:'lt'+i,x:LBLX,y:it._ly+3,fontSize:9,fill:'#374151',style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(it.serviceId)},
      (it.prevMean!=null?(it.prevMean+'→'):'')+it.familyMean+'  '+it.name.slice(0,26)));
  });
  return svg('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',maxWidth:W+'px',height:'auto',display:'block'}},els);
}
// One worksheet per service — a plain maturity-only questionnaire (1–5). Capital
// Consciousness is answered separately, once per round, on its own tab — see CCTab.
function ServiceWorksheet({service,round,levelLabels,onReload}){
  const [detail,setDetail]=useState(null);
  const [saved,setSaved]=useState(false);
  const [busy,setBusy]=useState(false);
  const [override,setOverride]=useState(null);
  const [open,setOpen]=useState(false);
  const [ans,setAns]=useState({});
  useEffect(()=>{if(open&&!detail)api.get('/api/maturity/services/'+service.id+'?round='+round.id).then(d=>{
    setDetail(d);const a={};(d.myResponses||[]).forEach(r=>a[r.questionId]=r.value);setAns(a);
  });},[open]);
  const questions=detail?detail.questions:[];
  const answered=Object.entries(ans).map(([questionId,value])=>({questionId,value}));
  const computed=detail?rollup(answered,questions):null;
  const myScore=detail?(detail.scores||[]).find(x=>x.userId===window.__me):null;
  const submitted=myScore&&myScore.submitted;
  async function save(){
    setBusy(true);
    try{
      await api.put('/api/maturity/responses',{roundId:round.id,serviceId:service.id,responses:answered});
      setSaved(true);setTimeout(()=>setSaved(false),1200);
    }catch(e){alert(e.message);}finally{setBusy(false);}
  }
  async function answer(q,value){
    const n={...ans,[q.id]:value};setAns(n);
    try{await api.put('/api/maturity/responses',{roundId:round.id,serviceId:service.id,responses:Object.entries(n).map(([questionId,value])=>({questionId,value}))});
      setSaved(true);setTimeout(()=>setSaved(false),1200);
    }catch(e){alert(e.message);}
  }
  async function submit(){
    setBusy(true);
    try{
      await save(); // always persist answers first, so the computed level is current
      if(override!=null)await api.put('/api/maturity/scores',{roundId:round.id,serviceId:service.id,level:override,rationale:'Direct override',submitted:false});
      await api.post('/api/maturity/services/'+service.id+'/submit',{roundId:round.id});
      await onReload();
      api.get('/api/maturity/services/'+service.id+'?round='+round.id).then(setDetail);
    }catch(e){alert(e.message);}finally{setBusy(false);}
  }
  const ready=override!=null||computed!=null;
  return h('div',{style:{borderTop:'0.5px solid var(--border)',padding:'8px 4px'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:8,cursor:'pointer'},onClick:()=>setOpen(!open)},
      h('span',{style:{fontWeight:600}},'#'+service.number+' '+service.name),
      submitted
        ?levelChip(myScore.level)
        :h('span',{className:'small muted'},'not submitted'),
      h('span',{style:{marginLeft:'auto',color:'var(--teal)',fontSize:11}},open?'▾':'▸')),
    open&&(!detail?h('div',{className:'small muted',style:{padding:8}},'Loading…'):h('div',{style:{padding:'8px 4px'}},
      h('div',{className:'small muted',style:{marginBottom:8}},(service.descriptors.find(d=>d.level===3)||{}).text),
      questions.map(q=>h('div',{key:q.id,style:{marginBottom:10}},
        h('div',{style:{fontSize:12,marginBottom:4}},q.prompt),
        q.helpText&&h('div',{className:'small muted',style:{marginBottom:4}},q.helpText),
        q.responseKind==='level_pick'
          ?service.descriptors.map(d=>h('div',{key:d.level,className:'pickrow'+(Number(ans[q.id])===d.level?' on':''),onClick:()=>answer(q,d.level)},
              h('span',{className:'pn'},d.level),h('span',null,(levelLabels.find(l=>l.level===d.level)||{}).name+' — '+d.text)))
          :h('div',{className:'scoresel'},AGREE.map((lbl,i)=>h('button',{key:i,className:Number(ans[q.id])===i+1?'on':'',title:lbl,onClick:()=>answer(q,i+1)},i+1)))
      )),
      h('div',{style:{display:'flex',alignItems:'center',gap:10,margin:'6px 0 6px',flexWrap:'wrap'}},
        h('span',{className:'small muted'},'Maturity:'),levelChip(override!=null?override:computed),
        h('button',{className:'linkbtn',onClick:()=>setOverride(override==null?(computed||3):null)},override==null?'adjust':'use computed'),
        override!=null&&h('div',{className:'scoresel'},[1,1.5,2,2.5,3,3.5,4,4.5,5].map(v=>h('button',{key:v,className:override===v?'on':'',onClick:()=>setOverride(v)},v))),
        saved&&h('span',{className:'small',style:{color:'var(--teal)'}},'saved')),
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginTop:12,flexWrap:'wrap'}},
        h('span',{style:{flex:1}}),
        !ready&&h('span',{className:'small muted'},'Answer the questions above to submit'),
        h('button',{className:'btn btn-teal btn-sm',disabled:busy||!ready,onClick:submit},submitted?'Re-submit':'Submit this service'))
    ))
  );
}

function ReportButtons({roundId,members}){
  const [emailing,setEmailing]=useState(false);
  const [to,setTo]=useState('');
  const [msg,setMsg]=useState('');
  const [busy,setBusy]=useState(false);
  async function send(){
    setBusy(true);setMsg('');
    try{
      await api.post('/api/maturity/report/email',{to:to.split(',').map(s=>s.trim()).filter(Boolean),round:roundId});
      setMsg('Sent.');setEmailing(false);setTo('');
    }catch(e){setMsg(e.message);}finally{setBusy(false);}
  }
  return h('span',{style:{display:'inline-flex',gap:6,alignItems:'center',flexWrap:'wrap'}},
    h('a',{className:'btn btn-outline btn-sm',href:'/api/maturity/report/pdf?round='+(roundId||''),target:'_blank'},'Print / PDF'),
    h('button',{className:'btn btn-outline btn-sm',onClick:()=>{setEmailing(!emailing);setMsg('');}},'Email PDF'),
    emailing&&h('span',{style:{display:'inline-flex',gap:4,alignItems:'center'}},
      h('input',{placeholder:'email addresses, comma-separated',value:to,onChange:e=>setTo(e.target.value),style:{width:240,border:'0.5px solid var(--border)',borderRadius:7,padding:'6px 10px',fontSize:12}}),
      h('button',{className:'btn btn-teal btn-sm',disabled:busy||!to.trim(),onClick:send},busy?'Sending…':'Send')),
    msg&&h('span',{className:'small muted'},msg)
  );
}

function ScorecardTab({data,members,roles,onOpenService,roundId,onPickRound}){
  const rounds=data.rounds||[];
  const services=data.services;
  return h('div',null,
    h('div',{className:'filters'},
      h('span',{className:'small muted'},'Round'),
      h('select',{value:roundId||'',onChange:e=>onPickRound(e.target.value)},rounds.map(r=>h('option',{key:r.id,value:r.id},r.label+(r.isAnchor?' ★':'')+' ('+r.status+')'))),

          h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Service'),
            members.map(m=>h('th',{key:m.id,title:m.name},m.name.split(' ')[0])),
            h('th',null,'Mean'),h('th',null,'Spread'),h('th',{title:"Claude's own independent read of where this family sits"},"Claude's read"),h('th',null,'Peer benchmark'),h('th',{title:'Peer benchmark minus family mean'},'Gap'),h('th',null,''))),
          h('tbody',null,svcs.map(s=>h('tr',{key:s.id,style:{cursor:'pointer'},onClick:()=>onOpenService(s.id)},
            h('td',null,s.number),
            h('td',null,s.name),
            members.map(m=>h('td',{key:m.id},s.stats.byUser[m.id]!=null?levelChip(s.stats.byUser[m.id]):h('span',{className:'muted'},'—'))),
            h('td',null,s.stats.mean!=null?h('b',null,s.stats.mean):'—'),
            h('td',null,s.stats.spread!=null?s.stats.spread:'—'),
            h('td',null,s.benchmark&&s.benchmark.assessedLevel!=null?levelChip(s.benchmark.assessedLevel):h('span',{className:'muted'},'—')),
            h('td',null,s.benchmark?levelChip(s.benchmark.peerLevel):h('span',{className:'muted'},'—')),
            h('td',null,s.gap==null?'—':h('span',{style:{fontWeight:700,color:s.gap>0.5?'#92400E':s.gap<-0.5?'#0F766E':'var(--muted)'}},(s.gap>0?'+':'')+s.gap)),
            h('td',null,s.actionCounts.open>0?h('span',{className:'small muted'},s.actionCounts.open+' action'+(s.actionCounts.open>1?'s':'')):'')
          ))))));
    })
  );
}

function ServiceDrawer({serviceId,roundId,members,roles,levelLabels,onClose,onChanged}){
  const [d,setD]=useState(null);
  const [busy,setBusy]=useState('');
  const [editLvl,setEditLvl]=useState(null);
  const [editText,setEditText]=useState('');
  const [editQ,setEditQ]=useState(null);
  const [editQPrompt,setEditQPrompt]=useState('');
  const [editQHelp,setEditQHelp]=useState('');
  function load(){return api.get('/api/maturity/services/'+serviceId+'?round='+(roundId||'')+'&allQuestions=1').then(setD);}
  useEffect(()=>{load();},[serviceId,roundId]);
  if(!d)return h('div',{className:'modal-overlay',onClick:onClose},h('div',{className:'modal'},'Loading…'));
  const s=d.service;
  async function saveDesc(level){
    try{await api.put('/api/maturity/services/'+s.id+'/descriptors/'+level,{text:editText});setEditLvl(null);await load();onChanged&&onChanged();}catch(e){alert(e.message);}
  }
  async function saveQuestion(q){
    if(!editQPrompt.trim())return;
    try{await api.put('/api/maturity/questions/'+q.id,{prompt:editQPrompt,helpText:editQHelp});setEditQ(null);await load();onChanged&&onChanged();}catch(e){alert(e.message);}
  }
  async function acceptSug(sg,text){try{await api.post('/api/maturity/descriptor-suggestions/'+sg.id+'/accept',text!=null?{text}:{});await load();onChanged&&onChanged();}catch(e){alert(e.message);}}
  async function dismissSug(sg){try{await api.post('/api/maturity/descriptor-suggestions/'+sg.id+'/dismiss',{});await load();}catch(e){alert(e.message);}}
  async function acceptQSug(sg,prompt,helpText){try{await api.post('/api/maturity/question-suggestions/'+sg.id+'/accept',(prompt!=null||helpText!=null)?{prompt,helpText}:{});await load();onChanged&&onChanged();}catch(e){alert(e.message);}}

  async function runBenchmark(){setBusy('bench');try{const r=await api.post('/api/maturity/rounds/'+roundId+'/benchmark',{serviceId:s.id});if(r.configured===false)alert('Claude is not configured on the server — benchmark unavailable.');await load();onChanged&&onChanged();}catch(e){alert(e.message);}finally{setBusy('');}}

      h('div',null,h('div',{className:'modal-title'},'#'+s.number+' '+s.name),
        h('div',{className:'modal-sub'},d.stats&&d.stats.mean!=null?('Family mean '+d.stats.mean):'Not assessed this round',
          d.benchmark&&d.benchmark.assessedLevel!=null?("  ·  Claude's read "+d.benchmark.assessedLevel):'',
          d.benchmark?('  ·  Peer benchmark '+d.benchmark.peerLevel):'')),
      h('button',{className:'btn btn-outline btn-sm',onClick:onClose},'Close')),

    h('div',{className:'sec'},'The five maturity levels'),
    d.descriptors.map(dd=>h('div',{key:dd.level,className:'line',style:{alignItems:'flex-start'}},
      h('div',{style:{flex:1}},
        h('b',null,dd.level+' · '+((levelLabels.find(l=>l.level===dd.level)||{}).name||'')),
        editLvl===dd.level
          ?h('div',null,h('textarea',{className:'form-textarea',value:editText,onChange:e=>setEditText(e.target.value)}),
             h('button',{className:'btn btn-teal btn-sm',onClick:()=>saveDesc(dd.level)},'Save'),
             h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},onClick:()=>setEditLvl(null)},'Cancel'))
          :h('div',{className:'small'},dd.text)),
      roles.maturityAdmin&&editLvl!==dd.level&&h('button',{className:'linkbtn',onClick:()=>{setEditLvl(dd.level);setEditText(dd.text);}},'edit'))),

    (d.suggestions&&d.suggestions.length)?h('div',null,

      d.suggestions.filter(sg=>sg.status==='pending').map(sg=>h('div',{key:sg.id,className:'card',style:{background:'var(--gold-l)',padding:10}},
        h('div',{className:'small'},h('b',null,'Level '+sg.level),' — ',sg.rationale),

          h('div',null,h('div',{className:'small muted'},'Suggested'),h('div',{className:'small'},sg.suggestedText))),
        roles.maturityAdmin&&h('div',{style:{marginTop:6}},
          h('button',{className:'btn btn-teal btn-sm',onClick:()=>acceptSug(sg)},'Accept'),
          h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},onClick:()=>{const t=prompt('Edit and accept:',sg.suggestedText);if(t!=null)acceptSug(sg,t);}},'Edit & accept'),
          h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},onClick:()=>dismissSug(sg)},'Dismiss'))))
    ):null,

    h('div',{className:'sec'},'Assessment questions'),

      h('div',{style:{flex:1}},
        editQ===q.id
          ?h('div',null,
              h('textarea',{className:'form-textarea',value:editQPrompt,onChange:e=>setEditQPrompt(e.target.value)}),
              h('input',{className:'form-input',placeholder:'Help text (optional)',value:editQHelp,onChange:e=>setEditQHelp(e.target.value)}),
              h('button',{className:'btn btn-teal btn-sm',onClick:()=>saveQuestion(q)},'Save'),

          :h('div',null,
              h('div',{className:'small'},q.prompt),

    (d.questionSuggestions&&d.questionSuggestions.length)?h('div',null,
      h('div',{className:'sec'},'Proposed question wording (Claude) — tailored to this service, review before the round opens'),
      d.questionSuggestions.filter(sg=>sg.status==='pending').map(sg=>h('div',{key:sg.id,className:'card',style:{background:'var(--gold-l)',padding:10}},
        sg.rationale&&h('div',{className:'small'},sg.rationale),
        h('div',{className:'grid2',style:{marginTop:6}},
          h('div',null,h('div',{className:'small muted'},'Current'),h('div',{className:'small'},sg.currentPrompt),
            sg.currentHelpText&&h('div',{className:'small muted',style:{marginTop:2}},sg.currentHelpText)),
          h('div',null,h('div',{className:'small muted'},'Suggested'),h('div',{className:'small'},sg.suggestedPrompt),

        roles.maturityAdmin&&h('div',{style:{marginTop:6}},
          h('button',{className:'btn btn-teal btn-sm',onClick:()=>acceptQSug(sg)},'Accept'),
          h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},onClick:()=>{
            const p=prompt('Edit the question:',sg.suggestedPrompt);if(p==null)return;
            const ht=prompt('Edit the help text (optional):',sg.suggestedHelpText||'');if(ht==null)return;
            acceptQSug(sg,p,ht);
          }},'Edit & accept'),
          h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},onClick:()=>dismissQSug(sg)},'Dismiss'))))
    ):null,

    h('div',{className:'sec'},'This round — maturity (1–5) per member'),
    (d.scores&&d.scores.length)?h('table',{className:'tbl'},
      h('thead',null,h('tr',null,h('th',null,'Member'),h('th',null,'Maturity'),h('th',null,'Method'),h('th',null,'Notes'),h('th',null,''))),
      h('tbody',null,d.scores.map(x=>h('tr',{key:x.userId},
        h('td',null,x.userName),h('td',null,levelChip(x.level)),
        h('td',null,h('span',{className:'small'},x.method)),
        h('td',null,h('span',{className:'small'},x.rationale||'—')),
        h('td',null,x.submitted?h('span',{className:'chip chip-l5'},'submitted'):h('span',{className:'small muted'},'draft')))))
    ):h('div',{className:'small muted'},'No scores recorded this round.'),

    h('div',{className:'sec'},'Claude benchmark — two independent reads'),
    d.benchmark?h('div',null,
      h('div',{className:'small muted',style:{marginBottom:8}},'by '+d.benchmark.searchedByName+' · '+(d.benchmark.searchedAt||'').slice(0,10)),
      h('div',{className:'grid2'},
        h('div',null,
          h('div',{className:'small muted'},"Claude's read of us"),
          h('div',{style:{marginTop:2}},levelChip(d.benchmark.assessedLevel)),
          d.benchmark.assessedRationale&&h('div',{className:'small',style:{marginTop:4}},d.benchmark.assessedRationale)),

          d.benchmark.peerRationale&&h('div',{className:'small',style:{marginTop:4}},d.benchmark.peerRationale))),
      d.benchmark.recommendedPriority&&h('div',{style:{marginTop:10}},
        priorityChip(d.benchmark.recommendedPriority),' ',
        d.benchmark.recommendation&&h('span',{className:'small'},d.benchmark.recommendation)),

        h('div',{className:'small muted'},'What would move us up'),

      (d.benchmark.sources||[]).length?h('div',{className:'small',style:{marginTop:4}},'Sources: ',d.benchmark.sources.map((sr,i)=>h('a',{key:i,href:sr.url,target:'_blank',style:{marginRight:8}},sr.title||sr.url))):null
    ):h('div',{className:'small muted'},'Not benchmarked this round.'),
    roles.maturityMember&&roundId&&h('button',{className:'btn btn-outline btn-sm',style:{marginTop:6},disabled:busy==='bench',onClick:runBenchmark},busy==='bench'?'Running…':(d.benchmark?'Re-run benchmark':'Run benchmark')),

    d.trend&&d.trend.length>1?h('div',null,h('div',{className:'sec'},'Trend'),
      h('table',{className:'tbl'},h('thead',null,h('tr',null,h('th',null,'Round'),h('th',null,'Family mean'),h('th',null,"Claude's read"),h('th',null,'Peer benchmark'))),
        h('tbody',null,d.trend.map(t=>h('tr',{key:t.roundId},h('td',null,t.label),h('td',null,t.mean!=null?t.mean:'—'),h('td',null,t.assessed!=null?t.assessed:'—'),h('td',null,t.benchmark!=null?t.benchmark:'—')))))):null,

    h('div',{className:'sec'},'Notes / actions'),
    h(ActionList,{actions:d.actions,serviceId:s.id,roundId,members,roles,onChanged:load})
  ));

function ActionList({actions,serviceId,dimensionId,roundId,members,roles,onChanged}){
  const [adding,setAdding]=useState(false);
  const [f,setF]=useState({title:'',detail:'',priority:'Active',dueQuarter:'',ownerText:''});
  async function add(){
    if(!f.title.trim())return;
    try{await api.post('/api/maturity/actions',{...f,serviceId,dimensionId,roundId});setAdding(false);setF({title:'',detail:'',priority:'Active',dueQuarter:'',ownerText:''});onChanged&&onChanged();}catch(e){alert(e.message);}
  }
  async function upd(a,patch){try{await api.put('/api/maturity/actions/'+a.id,patch);onChanged&&onChanged();}catch(e){alert(e.message);}}
  async function promote(a){
    const cat=prompt('Task category id (default "maturity"):','maturity');
    try{await api.post('/api/maturity/actions/'+a.id+'/promote',{categoryId:cat||'maturity',assignedToAll:true});onChanged&&onChanged();}catch(e){alert(e.message);}
  }
  async function unlink(a){if(!confirm('Unlink from the Family Task List task?'))return;try{await api.post('/api/maturity/actions/'+a.id+'/unlink',{});onChanged&&onChanged();}catch(e){alert(e.message);}}
  return h('div',null,
    (actions||[]).map(a=>h('div',{key:a.id,className:'line',style:{alignItems:'flex-start'}},
      h('div',{style:{flex:1}},
        h('b',null,a.title),' ',h('span',{className:'chip chip-'+(a.priority==='Immediate'?'l1':a.priority==='Active'?'l2':'l4')},a.priority),
        a.detail&&h('div',{className:'small muted'},a.detail),
        h('div',{className:'small muted'},(a.dueQuarter||'')+(a.ownerText?(' · '+a.ownerText):''),
          a.taskId?(a.linkedTaskDeleted?' · linked task deleted':' · synced to Task List ('+(a.task?a.task.status:'')+')'):'')),
      h('div',{style:{display:'flex',gap:4,flexShrink:0}},
        !a.taskId&&roles.maturityMember&&h('select',{value:a.status,onChange:e=>upd(a,{status:e.target.value})},['open','in_progress','done'].map(s=>h('option',{key:s,value:s},s))),
        !a.taskId&&roles.tasksMember&&h('button',{className:'linkbtn',onClick:()=>promote(a)},'→ Task List'),
        a.taskId&&roles.maturityMember&&h('button',{className:'linkbtn',onClick:()=>unlink(a)},'unlink'),
        roles.maturityMember&&h('button',{className:'linkbtn',style:{color:'#991B1B'},onClick:()=>{if(confirm('Remove this action?'))api.del('/api/maturity/actions/'+a.id).then(onChanged);}},'×')))),
    roles.maturityMember&&(adding
      ?h('div',{style:{marginTop:8}},
        h('input',{className:'form-input',placeholder:'Action title',value:f.title,onChange:e=>setF({...f,title:e.target.value})}),
        h('div',{className:'grid2'},
          h('select',{className:'form-select',value:f.priority,onChange:e=>setF({...f,priority:e.target.value})},PRIORITIES.map(p=>h('option',{key:p,value:p},p))),
          h('select',{className:'form-select',value:f.dueQuarter,onChange:e=>setF({...f,dueQuarter:e.target.value})},QUARTERS.map(q=>h('option',{key:q,value:q},q||'no target quarter')))),
        h('button',{className:'btn btn-teal btn-sm',onClick:add},'Add'),
        h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},onClick:()=>setAdding(false)},'Cancel'))
      :h('button',{className:'linkbtn',style:{marginTop:6},onClick:()=>setAdding(true)},'+ Add action')));
}

// =====================================================================
// Capital Consciousness tab — a standalone, once-per-round family-wide instrument
// (§5.8), NOT tied to any one service. Two earlier approaches — rating each of the 7
// statements independently 1-5, then ranking all 7 from most to least true — both proved
// more confusing than the thing they were meant to simplify. This just asks: which ONE
// statement best reflects the family today? The level is that statement's level — no
// computation, no separate override path, the same shape as the maturity worksheet's own
// "which of these five descriptions fits best" question.
// =====================================================================
function CCTab({roundId,roundMeta,consciousnessNote}){
  const [d,setD]=useState(null);
  const [picked,setPicked]=useState(null);
  const [note,setNote]=useState('');
  const [busy,setBusy]=useState(false);
  const [saved,setSaved]=useState(false);
  useEffect(()=>{
    setD(null);
    api.get('/api/maturity/cc'+(roundId?('?round='+roundId):'')).then(d=>{
      setD(d);
      setPicked(d.myScore?d.myScore.level:null);
      setNote((d.myScore&&d.myScore.note)||'');
    });
  },[roundId]);
  if(!d)return h('div',{className:'card'},'Loading…');
  if(!d.roundId)return h('div',{className:'card'},h('div',{className:'muted'},'No round to assess yet.'));
  const editable=roundMeta&&roundMeta.status==='open';
  const levels=d.levels||[];
  const statements=d.statements||[];
  const submitted=d.myScore&&d.myScore.submitted;
  async function pick(level){
    setPicked(level);
    try{
      await api.put('/api/maturity/consciousness-pick',{roundId:d.roundId,level});
      setSaved(true);setTimeout(()=>setSaved(false),1200);
    }catch(e){alert(e.message);}
  }
  async function saveNote(v){
    setNote(v);
    try{await api.put('/api/maturity/consciousness-pick',{roundId:d.roundId,note:v});}catch(e){}
  }
  async function submit(){
    setBusy(true);
    try{
      await api.post('/api/maturity/consciousness/submit',{roundId:d.roundId});
      const fresh=await api.get('/api/maturity/cc?round='+d.roundId);
      setD(fresh);
    }catch(e){alert(e.message);}finally{setBusy(false);}
  }
  const ready=picked!=null;
  const s=d.summary||{}, prev=d.prevSummary||{};
  return h('div',null,
    editable&&h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Where is the family today?'),
      d.question&&h('div',{className:'small muted',style:{marginBottom:10}},d.question.intro),
      statements.map(st=>h('div',{key:st.level,className:'pickrow'+(picked===st.level?' on':''),
        title:(levels.find(l=>l.level===st.level)||{}).description||'',onClick:()=>pick(st.level)},
        h('span',{className:'pn'},picked===st.level?'●':'○'),h('span',null,st.statement))),
      h('div',{style:{display:'flex',alignItems:'center',gap:10,margin:'10px 0 6px',flexWrap:'wrap'}},
        picked!=null&&h('span',null,h('span',{className:'small muted'},'Level:'),' ',ccChip(picked,levels)),
        saved&&h('span',{className:'small',style:{color:'var(--teal)'}},'saved')),
      h('input',{className:'form-input',placeholder:(d.question&&d.question.reflectionPrompt)||'Anything you\'d add? (optional)',value:note,
        onChange:e=>setNote(e.target.value),onBlur:e=>saveNote(e.target.value)}),
      h('div',{style:{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}},
        h('span',{style:{flex:1}}),
        !ready&&h('span',{className:'small muted'},'Pick the statement above that fits best to submit'),
        h('button',{className:'btn btn-teal btn-sm',disabled:busy||!ready,onClick:submit},submitted?'Re-submit':'Submit')),
      consciousnessNote&&h('div',{style:{marginTop:10,fontSize:10.5,color:'var(--muted)'}},consciousnessNote)),
    !editable&&h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Capital Consciousness'),
      h('div',{className:'small muted'},'This is answered once for the family while an assessment round is open.'),
      d.myScore&&h('div',{style:{marginTop:8}},'Your last placement: ',ccChip(d.myScore.level,levels))),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Family placement'),
      s.cog!=null
        ?h('div',null,
          h('div',{style:{fontSize:14}},'Family centre of gravity: ',ccChip(s.cog,levels),
            prev.cog!=null&&s.cog!==prev.cog
              ?h('span',{className:'small',style:{marginLeft:6,color:s.cog>prev.cog?'#0F766E':'#991B1B'}},(s.cog>prev.cog?'▲':'▼')+' was L'+prev.cog):null),
          h('div',{className:'track',style:{maxWidth:520}},
            h('div',{className:'cog',style:{left:((s.cog-1)/6*100)+'%'}}),
            s.min!=null&&h('div',{style:{position:'absolute',top:0,bottom:0,left:((s.min-1)/6*100)+'%',right:(100-(s.max-1)/6*100)+'%',background:'rgba(27,42,74,.10)'}})),
          h('div',{className:'small muted',style:{marginTop:4}},'Range L'+s.min+'–L'+s.max+' across '+s.count+' member'+(s.count===1?'':'s')+', spread '+s.spread+
            (s.straddlesThreshold?' — members on both sides of Level 4':'')),
          (s.members||[]).length?h('div',{style:{marginTop:8}},(s.members||[]).map(m=>h('div',{key:m.userId,className:'small'},h('b',null,m.name+': '),'L'+m.level+(m.note?' — "'+m.note+'"':'')))):null)
        :h('div',{className:'small muted'},'No Capital Consciousness answers submitted yet this round.'))
  );
}

// =====================================================================
// Progress tab
// =====================================================================
function ProgressTab({roundId}){
  const [p,setP]=useState(null);
  const [syn,setSyn]=useState(null);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{api.get('/api/maturity/profile?round='+(roundId||'')).then(setP);},[roundId]);
  if(!p)return h('div',{className:'card'},'Loading…');
  const series=p.aggregateSeries||[];
  const trend={
    labels:series.map(s=>s.label),
    datasets:[
      {label:'Family self-reported mean',data:series.map(s=>s.familyMean),borderColor:'#1B2A4A',backgroundColor:'rgba(27,42,74,.1)',tension:.3},
      {label:'Peer benchmark mean',data:series.map(s=>s.benchmarkMean),borderColor:'#C9A84C',backgroundColor:'rgba(201,168,76,.1)',borderDash:[5,4],tension:.3},
    ],
  };
  async function synth(){setBusy(true);try{const r=await api.post('/api/maturity/rounds/'+roundId+'/synthesis',{});if(r.configured===false)alert('Claude is not configured on the server.');else setSyn(r.synthesis);}catch(e){alert(e.message);}finally{setBusy(false);}}
  const improved=p.radar.filter(r=>r.delta>0).length, declined=p.radar.filter(r=>r.delta<0).length;
  return h('div',null,
    h('div',{className:'card'},h('div',{className:'sec',style:{marginTop:0}},'Are we improving? — self-reported vs. Claude benchmark'),
      series.length>1?h(ChartCanvas,{type:'line',height:240,data:trend,options:{scales:{y:{min:0,max:5}}}}):h('div',{className:'small muted'},'A trend line appears once two or more rounds are closed with benchmarks.')),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Movement by service — previous round → this round'),
      p.prevRoundId
        ?h('div',null,
          h('div',{className:'small muted',style:{marginBottom:6}},
            h('span',{style:{color:'#0F766E',fontWeight:700}},'▲ '+improved+' improved'),'   ',
            h('span',{style:{color:'#B91C1C',fontWeight:700}},'▼ '+declined+' declined'),
            '   · benchmark shown as ◆ on the Scorecard'),
          h(Slopegraph,{rows:p.radar,onOpen:null}))
        :h('div',{className:'small muted'},'No earlier round to compare against yet — this becomes the baseline.')),
    h('div',{className:'card'},h('div',{className:'sec',style:{marginTop:0}},'Round synthesis'),
      h('button',{className:'btn btn-outline btn-sm',disabled:busy,onClick:synth},busy?'Generating…':'Generate synthesis'),
      syn&&h('div',{style:{marginTop:8}},
        h('div',{className:'small'},h('b',null,'Doing things right. '),syn.doingThingsRight),
        h('div',{className:'small',style:{marginTop:6}},h('b',null,'Doing the right things. '),syn.doingTheRightThings),
        (syn.priorities||[]).length?h('div',{style:{marginTop:6}},h('div',{className:'small muted'},'Priorities'),(syn.priorities||[]).map((x,i)=>h('div',{key:i,className:'small'},'• '+x))):null))
  );
}

// =====================================================================
// Manage tab
// =====================================================================
// Every pending level-wording and question-wording suggestion for the active round, in
// one place — Accept / Edit & accept / Dismiss right here, instead of having to open each
// of the 16 services' drawers one by one to find them. Works whether the round is still a
// draft or already open (accepting updates the live wording immediately either way — the
// only difference is a round's own frozen ladder_json snapshot, taken at draft→open,
// won't retroactively pick up a change made after that transition).
function WordingSuggestionsPanel({roundId,onChanged}){
  const [d,setD]=useState(null);
  const [busy,setBusy]=useState('');
  function load(){return api.get('/api/maturity/rounds/'+roundId+'/wording-suggestions').then(setD);}
  useEffect(()=>{setD(null);if(roundId)load();},[roundId]);
  if(!roundId)return null;
  if(!d)return h('div',{className:'card'},h('div',{className:'sec',style:{marginTop:0}},'Wording suggestions'),'Loading…');
  const total=d.descriptors.length+d.questions.length;
  async function acceptDesc(sg,text){setBusy(sg.id);try{await api.post('/api/maturity/descriptor-suggestions/'+sg.id+'/accept',text!=null?{text}:{});await load();onChanged&&onChanged();}catch(e){alert(e.message);}finally{setBusy('');}}
  async function dismissDesc(sg){setBusy(sg.id);try{await api.post('/api/maturity/descriptor-suggestions/'+sg.id+'/dismiss',{});await load();}catch(e){alert(e.message);}finally{setBusy('');}}
  async function acceptQ(sg,promptText,helpText){setBusy(sg.id);try{await api.post('/api/maturity/question-suggestions/'+sg.id+'/accept',(promptText!=null||helpText!=null)?{prompt:promptText,helpText}:{});await load();onChanged&&onChanged();}catch(e){alert(e.message);}finally{setBusy('');}}
  async function dismissQ(sg){setBusy(sg.id);try{await api.post('/api/maturity/question-suggestions/'+sg.id+'/dismiss',{});await load();}catch(e){alert(e.message);}finally{setBusy('');}}
  if(!total)return h('div',{className:'card'},h('div',{className:'sec',style:{marginTop:0}},'Wording suggestions'),
    h('div',{className:'small muted'},'None pending. Use "Ask Claude to refresh wording" above to generate some.'));
  return h('div',{className:'card'},
    h('div',{className:'sec',style:{marginTop:0}},'Wording suggestions — '+total+' pending review'),
    d.descriptors.map(sg=>h('div',{key:'d-'+sg.id,className:'card',style:{background:'var(--gold-l)',padding:10}},
      h('div',{className:'small'},h('b',null,'#'+sg.serviceNumber+' '+sg.serviceName+' — Level '+sg.level),sg.rationale?(' — '+sg.rationale):''),
      h('div',{className:'grid2',style:{marginTop:6}},
        h('div',null,h('div',{className:'small muted'},'Current'),h('div',{className:'small'},sg.currentText)),
        h('div',null,h('div',{className:'small muted'},'Suggested'),h('div',{className:'small'},sg.suggestedText))),
      h('div',{style:{marginTop:6}},
        h('button',{className:'btn btn-teal btn-sm',disabled:busy===sg.id,onClick:()=>acceptDesc(sg)},'Accept'),
        h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},disabled:busy===sg.id,onClick:()=>{const t=prompt('Edit and accept:',sg.suggestedText);if(t!=null)acceptDesc(sg,t);}},'Edit & accept'),
        h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},disabled:busy===sg.id,onClick:()=>dismissDesc(sg)},'Dismiss')))),
    d.questions.map(sg=>h('div',{key:'q-'+sg.id,className:'card',style:{background:'var(--gold-l)',padding:10}},
      h('div',{className:'small'},h('b',null,'#'+sg.serviceNumber+' '+sg.serviceName+' — question'),sg.rationale?(' — '+sg.rationale):''),
      h('div',{className:'grid2',style:{marginTop:6}},
        h('div',null,h('div',{className:'small muted'},'Current'),h('div',{className:'small'},sg.currentPrompt),
          sg.currentHelpText&&h('div',{className:'small muted',style:{marginTop:2}},sg.currentHelpText)),
        h('div',null,h('div',{className:'small muted'},'Suggested'),h('div',{className:'small'},sg.suggestedPrompt),
          sg.suggestedHelpText&&h('div',{className:'small muted',style:{marginTop:2}},sg.suggestedHelpText))),
      h('div',{style:{marginTop:6}},
        h('button',{className:'btn btn-teal btn-sm',disabled:busy===sg.id,onClick:()=>acceptQ(sg)},'Accept'),
        h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},disabled:busy===sg.id,onClick:()=>{
          const p=prompt('Edit the question:',sg.suggestedPrompt);if(p==null)return;
          const ht=prompt('Edit the help text (optional):',sg.suggestedHelpText||'');if(ht==null)return;
          acceptQ(sg,p,ht);
        }},'Edit & accept'),
        h('button',{className:'btn btn-outline btn-sm',style:{marginLeft:6},disabled:busy===sg.id,onClick:()=>dismissQ(sg)},'Dismiss'))))
  );
}

function ManageTab({data,members,onReload}){
  const active=(data.rounds||[]).find(r=>r.status==='draft'||r.status==='open');
  const [label,setLabel]=useState('');
  const [carryFrom,setCarryFrom]=useState('');
  const [busy,setBusy]=useState('');
  const [msg,setMsg]=useState('');
  const closed=(data.rounds||[]).filter(r=>r.status==='closed');
  async function startRound(){setBusy('start');setMsg('');try{await api.post('/api/maturity/rounds',{label,carryFrom:carryFrom||undefined});setLabel('');await onReload();}catch(e){setMsg(e.message);}finally{setBusy('');}}
  async function act(path,label){setBusy(path);setMsg('');try{const r=await api.post('/api/maturity/rounds/'+active.id+'/'+path,{});if(r.configured===false)setMsg('Claude is not configured on the server.');else setMsg(label+' done.');await onReload();}catch(e){setMsg(e.message);}finally{setBusy('');}}
  async function del(r){
    if(!confirm('Delete "'+r.label+'"? This permanently removes every answer, score, and benchmark recorded in it. This cannot be undone.'))return;
    setBusy('delete-'+r.id);setMsg('');
    try{await api.del('/api/maturity/rounds/'+r.id);setMsg('Deleted.');await onReload();}catch(e){setMsg(e.message);}finally{setBusy('');}
  }
  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Assessment round'),
      msg&&h('div',{className:'alert alert-info'},msg),
      active?h('div',null,
        h('div',null,h('b',null,active.label),' ',h('span',{className:'pill pill-'+active.status},active.status)),
        h('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}},
          h('button',{className:'btn btn-outline btn-sm',disabled:busy,onClick:()=>act('suggest-wording','Wording suggestions')},busy==='suggest-wording'?'Asking Claude…':'Ask Claude to refresh wording — levels & questions (all 16)'),
          active.status==='draft'&&h('button',{className:'btn btn-teal btn-sm',disabled:busy,onClick:()=>act('open','Open round')},'Open the round for assessment'),
          active.status==='open'&&h('button',{className:'btn btn-outline btn-sm',disabled:busy,onClick:()=>act('benchmark','Benchmark')},busy==='benchmark'?'Benchmarking…':'Run Claude benchmark (all 16)'),
          active.status==='open'&&h('button',{className:'btn btn-navy btn-sm',disabled:busy,onClick:()=>{if(confirm('Close this round? It becomes read-only and, if it has benchmarks, the comparison anchor.'))act('close','Close round');}},'Close the round'),
          h('button',{className:'btn btn-danger btn-sm',disabled:busy,onClick:()=>del(active)},busy==='delete-'+active.id?'Deleting…':'Delete this round')),
        h('div',{className:'small muted',style:{marginTop:6}},'Review proposed wording below, or per service from the Scorecard tab → open a service.')
      ):h('div',null,
        h('div',{className:'grid2'},
          h('input',{className:'form-input',placeholder:'Round label, e.g. 2026 H2',value:label,onChange:e=>setLabel(e.target.value)}),
          h('select',{className:'form-select',value:carryFrom,onChange:e=>setCarryFrom(e.target.value)},
            h('option',{value:''},'Start blank'),
            closed.map(r=>h('option',{key:r.id,value:r.id},'Carry answers from '+r.label)))),
        h('button',{className:'btn btn-teal btn-sm',disabled:busy||!label.trim(),onClick:startRound},'Start a draft round'))),
    h(WordingSuggestionsPanel,{roundId:active?active.id:null,onChanged:onReload}),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Closed rounds'),
      closed.length?closed.map(r=>h('div',{key:r.id,className:'line'},
        h('div',null,h('b',null,r.label),r.isAnchor&&h('span',{className:'chip chip-l3',style:{marginLeft:6}},'anchor'),
          h('div',{className:'small muted'},(r.closedAt||'').slice(0,10))),
        h('span',{style:{display:'flex',gap:10,alignItems:'center'}},
          h('a',{className:'linkbtn',href:'/api/maturity/report/pdf?round='+r.id,target:'_blank'},'PDF'),
          h('button',{className:'linkbtn',style:{color:'#991B1B'},disabled:busy,onClick:()=>del(r)},busy==='delete-'+r.id?'Deleting…':'Delete')))):h('div',{className:'small muted'},'None yet.')),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Roles'),
      members.map(m=>h('div',{key:m.id,style:{display:'flex',alignItems:'center',gap:10,padding:'6px 0',borderBottom:'0.5px solid var(--border)'}},
        h('span',{style:{flex:1}},m.name),
        h('select',{value:m.maturityRole||'member',onChange:async e=>{try{await api.put('/api/admin/members/'+m.id+'/app-role',{app:'maturity',role:e.target.value});onReload();}catch(err){alert(err.message);}}},
          ['admin','member','viewer'].map(r=>h('option',{key:r,value:r},r[0].toUpperCase()+r.slice(1)))))))
  );
}

// =====================================================================
// Shell
// =====================================================================
function MaturityApp({me,roles}){
  const [data,setData]=useState(null);
  const [err,setErr]=useState('');
  const [tab,setTab]=useState('scorecard');
  const [roundId,setRoundId]=useState('');
  const [openSvc,setOpenSvc]=useState(null);
  function load(rid){
    const q=rid||roundId;
    return api.get('/api/maturity/overview'+(q?('?round='+q):''))
      .then(d=>{setData(d);if(!roundId&&d.round)setRoundId(d.round.id);})
      .catch(e=>{if(e.code===401)location.href='/due-diligence?returnTo='+encodeURIComponent(location.pathname);else setErr(e.message);});
  }
  useEffect(()=>{window.__me=me.id;load();},[]);
  useEffect(()=>{if(roundId)load(roundId);},[roundId]);
  if(err)return h('div',{className:'page'},h('div',{className:'alert alert-danger'},err));
  if(!data)return h('div',{className:'page'},'Loading…');
  const TABS=[['assessment','Assessment'],['cc','Capital Consciousness'],['scorecard','Scorecard'],['progress','Progress']];
  if(roles.maturityAdmin)TABS.push(['manage','Manage']);
  return h('div',{className:'page'},
    h('div',{style:{marginBottom:12}},
      h('div',{style:{fontSize:18,fontWeight:700,color:'var(--navy)'}},'Maturity Assessment'),
      h('div',{className:'small muted'},'Robinson Family Office — is the family office getting more effective over time?'+(roles.maturityMember?'':' · read-only'))),
    h('div',{className:'tabs'},TABS.map(([k,l])=>h('div',{key:k,className:'tab'+(tab===k?' active':''),onClick:()=>setTab(k)},l))),
    tab==='assessment'&&h(AssessmentTab,{data,me,roles,onReload:()=>load(roundId)}),
    tab==='cc'&&h(CCTab,{roundId,roundMeta:(data.rounds||[]).find(r=>r.id===roundId)||data.round,consciousnessNote:data.consciousnessNote}),
    tab==='scorecard'&&h(ScorecardTab,{data,members:data.members,roles,roundId,onPickRound:setRoundId,onOpenService:setOpenSvc}),
    tab==='progress'&&h(ProgressTab,{roundId}),
    tab==='manage'&&roles.maturityAdmin&&h(ManageTab,{data,members:data.members,onReload:()=>load(roundId)}),
    openSvc&&h(ServiceDrawer,{serviceId:openSvc,roundId,members:data.members,roles,levelLabels:data.levelLabels,onClose:()=>setOpenSvc(null),onChanged:()=>load(roundId)})
  );
}

function Shell(){
  const [me,setMe]=useState(null);const [checking,setChecking]=useState(true);const [menu,setMenu]=useState(false);
  useEffect(()=>{api.get('/api/me').then(setMe).catch(()=>{location.href='/due-diligence?returnTo='+encodeURIComponent(location.pathname);}).finally(()=>setChecking(false));},[]);
  async function logout(){await api.post('/api/logout');location.href='/due-diligence';}
  if(checking||!me)return h('div',{style:{padding:40,textAlign:'center',color:'var(--muted)'}},'Loading…');
  const roles={maturityAdmin:me.maturityAdmin,maturityMember:me.maturityAdmin||me.maturityRole==='member',tasksMember:me.tasksAdmin||me.tasksRole==='member'};
  return h('div',null,
    h('nav',{className:'nav'},
      h('div',{className:'nav-brand'},h('a',{href:'/'},'Robinson Family Office'),h('span',null,'Maturity Assessment'),
        h('a',{href:'/risk',style:{color:'rgba(255,255,255,.75)',fontSize:11,marginLeft:14,textDecoration:'none'}},'Risk Management →')),
      h('div',{className:'nav-user',onClick:()=>setMenu(!menu)},me.name.split(' ')[0])),
    menu&&h('div',{style:{position:'fixed',top:56,right:16,background:'#fff',border:'0.5px solid var(--border)',borderRadius:10,padding:8,zIndex:400,minWidth:180,boxShadow:'0 4px 20px rgba(0,0,0,.12)'}},
      h('div',{style:{padding:'8px 10px',fontSize:13,fontWeight:600,color:'var(--navy)'}},me.name),
      h('div',{style:{padding:'0 10px 8px',fontSize:11,color:'var(--muted)'}},roles.maturityAdmin?'Maturity Admin':roles.maturityMember?'Maturity Member':'Read-only'),
      me.isAdmin&&h('a',{href:'/admin',style:{display:'block',borderTop:'0.5px solid var(--border)',padding:'8px 10px',fontSize:12,color:'var(--navy)',fontWeight:600,textDecoration:'none'}},'Manage Members'),
      h('div',{style:{padding:'8px 10px',cursor:'pointer',fontSize:12,color:'#991B1B',fontWeight:600},onClick:logout},'Sign out')),
    h(MaturityApp,{me,roles})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Shell));
</script>
