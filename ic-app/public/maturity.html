<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robinson Family Office — Maturity Assessment</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/chart.js@4.5.1/dist/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--teal:#2A7D7B;--gold:#C9A84C;--navy-l:#E8ECF3;--teal-l:#EAF4F4;--gold-l:#FDF6E3;--red-l:#FEE2E2;--amber-l:#FEF3C7;--green-l:#D1FAE5;--text:#1B2A4A;--muted:#6B7280;--border:#E5E7EB;--bg:#F9FAFB;--card:#fff;--r:10px;
  --l1-fg:#9D174D;--l1-bg:#FCE7F0;--l2-fg:#92400E;--l2-bg:#FEF3C7;--l3-fg:#1E3A8A;--l3-bg:#E8ECF3;--l4-fg:#0F766E;--l4-bg:#EAF4F4;--l5-fg:#065F46;--l5-bg:#E8F8EF}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.nav{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:200;gap:16px}
.nav-brand{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:14px}
.nav-brand a{color:#fff;text-decoration:none}
.nav-brand span{color:var(--gold);font-size:11px}
.nav-user{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer}
.page{padding:20px;max-width:1120px;margin:0 auto}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn-gold{background:var(--gold);color:#fff}.btn-teal{background:var(--teal);color:#fff}.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:#fff;color:var(--navy);border:0.5px solid var(--border)}
.btn-danger{background:#fff;color:#991B1B;border:0.5px solid #F3D6D6}
.btn-sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:0.5px solid var(--border)}
.tab{padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;user-select:none}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chip-l1{background:var(--l1-bg);color:var(--l1-fg)}.chip-l2{background:var(--l2-bg);color:var(--l2-fg)}
.chip-l3{background:var(--l3-bg);color:var(--l3-fg)}.chip-l4{background:var(--l4-bg);color:var(--l4-fg)}
.chip-l5{background:var(--l5-bg);color:var(--l5-fg)}.chip-none{background:var(--bg);color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--navy-l);color:var(--navy)}
.pill-draft{background:var(--gold-l);color:#92400E}.pill-open{background:var(--green-l);color:#065F46}.pill-closed{background:var(--navy-l);color:var(--navy)}
.dgroup{margin-bottom:14px}
.dhead{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer}
.ddot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex-shrink:0}
.dtitle{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.4px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-top:0.5px solid var(--border);cursor:pointer}
.rrow:hover{background:var(--bg)}
.rnum{font-size:11px;font-weight:700;color:var(--muted);padding-top:2px}
.rtitle{font-size:13px;font-weight:600;color:var(--navy)}
.rdesc{font-size:11.5px;color:var(--muted);margin-top:2px}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rmeta .k{font-size:10.5px;color:var(--muted)}
.rright{display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:0.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;background:#fff}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--navy);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-input,.form-select,.form-textarea{width:100%;border:0.5px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px;color:var(--text);background:#fff;font-family:inherit;margin-bottom:12px}
.form-textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:820px;width:100%;max-height:calc(100vh - 48px);overflow-y:auto}
.modal-sm{max-width:460px}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.sec{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.3px;margin:18px 0 6px}
.line{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:0.5px dashed var(--border);font-size:12px}
.line:last-child{border-bottom:none}
.muted{color:var(--muted)}.small{font-size:11px}
.alert{padding:9px 13px;border-radius:8px;font-size:12px;margin-bottom:12px;border:0.5px solid}
.alert-success{background:var(--green-l);border-color:#6EE7B7;color:#065F46}
.alert-danger{background:var(--red-l);border-color:#FCA5A5;color:#991B1B}
.alert-info{background:var(--navy-l);border-color:#C7D2FE;color:var(--navy)}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:12px}
.kcard .v{font-size:20px;font-weight:700;color:var(--navy)}
.kcard .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:0.5px solid var(--border)}
table.tbl td{padding:7px 8px;border-bottom:0.5px solid var(--border);vertical-align:top}
.scoresel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scoresel button{min-width:30px;height:30px;padding:0 6px;border-radius:7px;border:0.5px solid var(--border);background:#fff;font-weight:700;font-size:12px;cursor:pointer;color:var(--navy)}
.scoresel button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:600;font-size:11px;cursor:pointer;padding:0}
.pickrow{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:0.5px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:12px}
.pickrow.on{border-color:var(--navy);background:var(--navy-l)}
.pickrow .pn{font-weight:700;color:var(--muted);flex-shrink:0}
.arc{display:flex;gap:3px;flex-wrap:wrap}
.arc .step{flex:1;min-width:64px;text-align:center;border:0.5px solid var(--border);border-radius:7px;padding:5px 4px;cursor:pointer;font-size:10.5px;background:#fff}
.arc .step.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.arc .step .n{font-weight:700;font-size:12px}
.track{position:relative;height:34px;border-radius:8px;background:linear-gradient(90deg,var(--l1-bg),var(--gold-l),var(--l5-bg));margin:6px 0}
.track .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.track .cog{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.rrow{grid-template-columns:22px 1fr}.rright{align-items:flex-start;margin-top:6px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const h=React.createElement;
const api={
  async get(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){const e=new Error('UNAUTHENTICATED');e.code=401;throw e;}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
  async send(m,u,b){const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});if(r.status===401){const e=new Error('UNAUTHENTICATED');e.code=401;throw e;}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
  post(u,b){return api.send('POST',u,b)},put(u,b){return api.send('PUT',u,b)},
  async del(u){const r=await fetch(u,{method:'DELETE',credentials:'same-origin'});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json();},
};

// mirrors server/maturity.js levelClass / levelRollup
function levelClass(n){n=Number(n);if(!isFinite(n))return 'none';if(n<2)return 'l1';if(n<3)return 'l2';if(n<4)return 'l3';if(n<5)return 'l4';return 'l5';}
function rollup(answers,questions){
  const w=new Map(questions.map(q=>[q.id,Number(q.weight)||1]));
  let s=0,tw=0;
  for(const a of answers){if(!w.has(a.questionId))continue;const v=Number(a.value);if(!isFinite(v))continue;const ww=w.get(a.questionId);s+=v*ww;tw+=ww;}
  if(!tw)return null;
  return Math.max(1,Math.min(5,Math.round((s/tw)*2)/2));
}
function levelChip(level,extra){
  if(level==null)return h('span',{className:'chip chip-none'},'—');
  return h('span',{className:'chip chip-'+levelClass(level),title:extra||''},Number(level).toFixed(1).replace(/\.0$/,''));
}
const AGREE=['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];
const QUARTERS=['','Q1 2026','Q2 2026','Q3 2026','Q4 2026','Q1 2027','Q2 2027','Q3 2027','Q4 2027'];
const PRIORITIES=['Immediate','Active','Monitor'];

function ChartCanvas({type,data,options,height,plugins}){
  const ref=useRef(null);const chartRef=useRef(null);
  const opts=Object.assign({responsive:true,maintainAspectRatio:false},options||{});
  useEffect(()=>{
    if(!ref.current)return;
    if(chartRef.current&&chartRef.current.config.type===type){chartRef.current.data=data;chartRef.current.options=opts;chartRef.current.update();}
    else{if(chartRef.current)chartRef.current.destroy();chartRef.current=new Chart(ref.current,{type,data,options:opts,plugins:plugins||[]});}
  },[JSON.stringify(data),JSON.stringify(options),type]);
  useEffect(()=>()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}},[]);
  return h('div',{style:{position:'relative',height:(height||260)+'px',width:'100%'}},h('canvas',{ref}));
}

// =====================================================================
// Assessment tab
// =====================================================================
function AssessmentTab({data,me,roles,onReload}){
  const round=data.round;
  if(!round||round.status!=='open'){
    return h('div',{className:'card'},
      h('div',{className:'muted'},round&&round.status==='draft'
        ?'The next round is being set up. It will open for assessment shortly.'
        :'No assessment round is open. An administrator opens one from the Manage tab.'));
  }
  return h('div',null,
    h(AssessmentProgress,{round}),
    h('div',{className:'sec'},'One worksheet per service — how well it is run (1–5) and from what level it is run (1–7)'),
    data.groups.map(g=>{
      const svcs=data.services.filter(s=>s.groupId===g.id);
      if(!svcs.length)return null;
      return h('div',{className:'card dgroup',key:g.id},
        h('div',{className:'dhead'},h('span',{className:'ddot'}),h('span',{className:'dtitle'},g.name)),
        svcs.map(s=>h(ServiceWorksheet,{key:s.id,service:s,round,levelLabels:data.levelLabels,onReload})));
    })
  );
}
function AssessmentProgress({round}){
  return h('div',{className:'card'},
    h('div',{style:{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}},
      h('div',null,h('b',null,round.label),' ',h('span',{className:'pill pill-open'},'open')),
      h('div',{className:'small muted'},'For each service: answer the maturity questions, pick the level of awareness it is run from, then Submit.')),
    (round.completion||[]).length?h('table',{className:'tbl',style:{marginTop:8}},
      h('thead',null,h('tr',null,h('th',null,'Member'),h('th',null,'Services submitted'),h('th',null,''))),
      h('tbody',null,round.completion.map(c=>h('tr',{key:c.userId},
        h('td',null,c.name+(c.me?' (you)':'')),
        h('td',null,c.servicesDone+' / '+c.servicesTotal),
        h('td',null,c.complete?h('span',{className:'chip chip-l5'},'complete'):h('span',{className:'small muted'},'in progress')))))
    ):null);
}
// colours for the 1–7 consciousness axis (reused in the scorecard + drawer + progress)
function ccClass(n){n=Number(n);if(!isFinite(n))return 'none';if(n<=2)return 'l1';if(n===3)return 'l2';if(n===4)return 'l3';if(n<=5)return 'l4';return 'l5';}
function ccChip(level,levels){
  if(level==null)return h('span',{className:'chip chip-none'},'—');
  const nm=(levels||[]).find(l=>l.level===Math.round(level));
  return h('span',{className:'chip chip-'+ccClass(level),title:nm?nm.description:''},'L'+level+(nm?' '+nm.name:''));
}
const CC_HEX={l1:'#9D174D',l2:'#B45309',l3:'#1E3A8A',l4:'#0F766E',l5:'#065F46',none:'#9CA3AF'};
const svg=(tag,props,...kids)=>h(tag,props,...kids);

// ---- Grouped lollipop: one row per service, maturity 1–5 axis. Family mean dot
// (coloured by the consciousness level the service is run from), Claude-benchmark
// diamond, and a faint band for the member min–max spread. Replaces the radar. ----
function LollipopChart({groups,services,consciousnessLevels,onOpen}){
  const W=680, LX=196, RX=W-18, RH=21, PAD_TOP=34, PAD_BOT=10;
  const rows=[]; // {type:'group'|'svc', ...}
  groups.forEach(g=>{
    const svcs=services.filter(s=>s.groupId===g.id);
    if(!svcs.length)return;
    rows.push({type:'group',name:g.name});
    svcs.forEach(s=>rows.push({type:'svc',s}));
  });
  const H=PAD_TOP+rows.length*RH+PAD_BOT;
  const x=v=>LX+((Math.max(1,Math.min(5,v))-1)/4)*(RX-LX);
  let y=PAD_TOP;
  const els=[];
  // gridlines + axis labels
  for(let v=1;v<=5;v++){
    els.push(svg('line',{key:'g'+v,x1:x(v),y1:PAD_TOP-6,x2:x(v),y2:H-PAD_BOT,stroke:'#EEF0F3',strokeWidth:1}));
    els.push(svg('text',{key:'gl'+v,x:x(v),y:PAD_TOP-12,textAnchor:'middle',fontSize:9,fill:'#9CA3AF'},v));
  }
  els.push(svg('text',{key:'lgd',x:LX,y:12,fontSize:9,fill:'#6B7280'},'● family mean (colour = consciousness level)   ◆ Claude benchmark   ▭ member spread'));
  rows.forEach((r,i)=>{
    const cy=y+RH/2;
    if(r.type==='group'){
      els.push(svg('text',{key:'gr'+i,x:8,y:cy+3,fontSize:9.5,fontWeight:700,fill:'#2A7D7B',style:{textTransform:'uppercase',letterSpacing:'.4px'}},r.name));
    }else{
      const s=r.s, st=s.stats||{}, cc=st.consciousness||{};
      els.push(svg('text',{key:'n'+i,x:8,y:cy+3,fontSize:10,fill:'#1B2A4A',style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(s.id)},('#'+s.number+' '+s.name).slice(0,34)));
      els.push(svg('line',{key:'t'+i,x1:LX,y1:cy,x2:RX,y2:cy,stroke:'#EDEFF2',strokeWidth:5,strokeLinecap:'round'}));
      if(st.mean==null){
        els.push(svg('text',{key:'na'+i,x:LX+8,y:cy+3,fontSize:9,fill:'#9CA3AF'},'not assessed this round'));
      }else{
        if(st.min!=null&&st.max!=null&&st.max>st.min){
          els.push(svg('rect',{key:'sp'+i,x:x(st.min),y:cy-3,width:Math.max(2,x(st.max)-x(st.min)),height:6,rx:3,fill:'rgba(27,42,74,.14)'}));
        }
        if(s.benchmark&&s.benchmark.benchmarkLevel!=null){
          const bx=x(s.benchmark.benchmarkLevel);
          els.push(svg('rect',{key:'bm'+i,x:bx-4.5,y:cy-4.5,width:9,height:9,transform:'rotate(45 '+bx+' '+cy+')',fill:'#fff',stroke:'#C9A84C',strokeWidth:1.6}));
        }
        els.push(svg('circle',{key:'m'+i,cx:x(st.mean),cy:cy,r:5,fill:CC_HEX[ccClass(cc.cog)],stroke:'#fff',strokeWidth:1.5,style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(s.id)}));
        els.push(svg('text',{key:'mv'+i,x:Math.min(RX,x(st.mean)+9),y:cy-7,fontSize:8.5,fill:'#6B7280'},st.mean));
      }
    }
    y+=RH;
  });
  return svg('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',maxWidth:W+'px',height:'auto',display:'block'}},els);
}

// ---- Slopegraph: previous round -> this round, one line per service assessed this
// round, coloured by direction. Right-side labels are nudged apart to avoid overlap. ----
function Slopegraph({rows,onOpen}){
  const items=(rows||[]).filter(r=>r.familyMean!=null).map(r=>({...r}));
  if(!items.length)return h('div',{className:'small muted'},'Nothing assessed this round yet.');
  const W=560, XP=150, XN=360, LBLX=372, TOP=26, BOT=20, H=Math.max(220,items.length*13+TOP+BOT);
  const y=v=>TOP+((5-Math.max(1,Math.min(5,v)))/4)*(H-TOP-BOT);
  const els=[];
  for(let v=1;v<=5;v++){
    els.push(svg('line',{key:'g'+v,x1:XP,y1:y(v),x2:XN,y2:y(v),stroke:'#EEF0F3',strokeWidth:1}));
    els.push(svg('text',{key:'gl'+v,x:XP-10,y:y(v)+3,textAnchor:'end',fontSize:9,fill:'#9CA3AF'},v));
  }
  els.push(svg('text',{key:'hp',x:XP,y:14,textAnchor:'middle',fontSize:9.5,fontWeight:700,fill:'#6B7280'},'Previous round'));
  els.push(svg('text',{key:'hn',x:XN,y:14,textAnchor:'middle',fontSize:9.5,fontWeight:700,fill:'#6B7280'},'This round'));
  // anti-collision label layout, sorted by this-round value
  const sorted=items.slice().sort((a,b)=>b.familyMean-a.familyMean);
  let last=-99; const gap=11;
  sorted.forEach(it=>{ let ly=y(it.familyMean); if(ly<last+gap)ly=last+gap; it._ly=ly; last=ly; });
  sorted.forEach((it,i)=>{
    const col=it.prevMean==null?'#9CA3AF':(it.familyMean>it.prevMean?'#0F766E':it.familyMean<it.prevMean?'#B91C1C':'#9CA3AF');
    if(it.prevMean!=null){
      els.push(svg('line',{key:'l'+i,x1:XP,y1:y(it.prevMean),x2:XN,y2:y(it.familyMean),stroke:col,strokeWidth:1.5,opacity:.85}));
      els.push(svg('circle',{key:'p'+i,cx:XP,cy:y(it.prevMean),r:2.6,fill:col}));
    }
    els.push(svg('circle',{key:'n'+i,cx:XN,cy:y(it.familyMean),r:3.2,fill:col,style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(it.serviceId)}));
    els.push(svg('line',{key:'ll'+i,x1:XN+4,y1:y(it.familyMean),x2:LBLX-2,y2:it._ly,stroke:'#E5E7EB',strokeWidth:1}));
    els.push(svg('text',{key:'lt'+i,x:LBLX,y:it._ly+3,fontSize:9,fill:'#374151',style:{cursor:'pointer'},onClick:()=>onOpen&&onOpen(it.serviceId)},
      (it.prevMean!=null?(it.prevMean+'→'):'')+it.familyMean+'  '+it.name.slice(0,26)));
  });
  return svg('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',maxWidth:W+'px',height:'auto',display:'block'}},els);
}
function ServiceWorksheet({service,round,levelLabels,onReload}){
  const [detail,setDetail]=useState(null);
  const [ans,setAns]=useState({});
  const [saved,setSaved]=useState(false);
  const [busy,setBusy]=useState(false);
  const [override,setOverride]=useState(null);
  const [open,setOpen]=useState(false);
  const [cc,setCc]=useState(null);        // my consciousness level for this service
  const [ccNote,setCcNote]=useState('');
  useEffect(()=>{if(open&&!detail)api.get('/api/maturity/services/'+service.id+'?round='+round.id).then(d=>{
    setDetail(d);const a={};(d.myResponses||[]).forEach(r=>a[r.questionId]=r.value);setAns(a);

    open&&(!detail?h('div',{className:'small muted',style:{padding:8}},'Loading…'):h('div',{style:{padding:'8px 4px'}},
      h('div',{className:'small muted',style:{marginBottom:8}},(service.descriptors.find(d=>d.level===3)||{}).text),
      h('div',{className:'small',style:{fontWeight:700,color:'var(--teal)',margin:'4px 0'}},'How well is it run? (maturity, 1–5)'),
      questions.map(q=>h('div',{key:q.id,style:{marginBottom:10}},

              h('span',{className:'pn'},d.level),h('span',null,(levelLabels.find(l=>l.level===d.level)||{}).name+' — '+d.text)))
          :h('div',{className:'scoresel'},AGREE.map((lbl,i)=>h('button',{key:i,className:Number(ans[q.id])===i+1?'on':'',title:lbl,onClick:()=>{const n={...ans,[q.id]:i+1};setAns(n);save(n);}},i+1)))
      )),

        override!=null&&h('div',{className:'scoresel'},[1,1.5,2,2.5,3,3.5,4,4.5,5].map(v=>h('button',{key:v,className:override===v?'on':'',onClick:()=>setOverride(v)},v))),

        h('tbody',null,(cc.byService||[]).map(s=>{
          const w=s.maturityMean!=null?(s.maturityMean/5*100):0;
          const col=({l1:'#9D174D',l2:'#B45309',l3:'#1E3A8A',l4:'#0F766E',l5:'#065F46',none:'#9CA3AF'})[ccClass(s.cog)];
          return h('tr',{key:s.serviceId},
            h('td',null,s.number),h('td',null,s.name),
            h('td',null,h('div',{style:{position:'relative',height:16,background:'var(--bg)',borderRadius:4}},
              h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:w+'%',background:col,borderRadius:4}}),
              h('div',{style:{position:'absolute',right:4,top:0,fontSize:10,lineHeight:'16px',color:'var(--muted)'}},s.maturityMean!=null?s.maturityMean:'—'))),
            h('td',null,ccChip(s.cog,levels),s.prevCog!=null&&s.cog!=null&&s.cog!==s.prevCog?h('span',{className:'small muted'},' (was L'+s.prevCog+')'):null,s.straddlesThreshold?h('span',{title:'members on both sides of Level 4',style:{color:'#92400E'}},' ⚠'):null),
            h('td',null,s.spread!=null?s.spread:'—'));
        })))))
  );
}

// =====================================================================
// Progress tab
// =====================================================================
function ProgressTab({roundId,consciousnessNote}){
  const [p,setP]=useState(null);
  const [syn,setSyn]=useState(null);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{api.get('/api/maturity/profile?round='+(roundId||'')).then(setP);},[roundId]);
  if(!p)return h('div',{className:'card'},'Loading…');
  const series=p.aggregateSeries||[];
  const trend={
    labels:series.map(s=>s.label),
    datasets:[
      {label:'Family self-reported mean',data:series.map(s=>s.familyMean),borderColor:'#1B2A4A',backgroundColor:'rgba(27,42,74,.1)',tension:.3},
      {label:'Claude benchmarked mean',data:series.map(s=>s.benchmarkMean),borderColor:'#C9A84C',backgroundColor:'rgba(201,168,76,.1)',borderDash:[5,4],tension:.3},
    ],
  };
  async function synth(){setBusy(true);try{const r=await api.post('/api/maturity/rounds/'+roundId+'/synthesis',{});if(r.configured===false)alert('Claude is not configured on the server.');else setSyn(r.synthesis);}catch(e){alert(e.message);}finally{setBusy(false);}}
  const improved=p.radar.filter(r=>r.delta>0).length, declined=p.radar.filter(r=>r.delta<0).length;
  return h('div',null,
    h('div',{className:'card'},h('div',{className:'sec',style:{marginTop:0}},'Are we improving? — self-reported vs. Claude benchmark'),
      series.length>1?h(ChartCanvas,{type:'line',height:240,data:trend,options:{scales:{y:{min:0,max:5}}}}):h('div',{className:'small muted'},'A trend line appears once two or more rounds are closed with benchmarks.')),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Movement by service — previous round → this round'),
      p.prevRoundId
        ?h('div',null,
          h('div',{className:'small muted',style:{marginBottom:6}},
            h('span',{style:{color:'#0F766E',fontWeight:700}},'▲ '+improved+' improved'),'   ',
            h('span',{style:{color:'#B91C1C',fontWeight:700}},'▼ '+declined+' declined'),
            '   · benchmark shown as ◆ on the Scorecard'),
          h(Slopegraph,{rows:p.radar,onOpen:null}))
        :h('div',{className:'small muted'},'No earlier round to compare against yet — this becomes the baseline.')),
    h(ConsciousnessSection,{cc:p.consciousness,note:consciousnessNote}),
    h(ConsciousnessSection,{cc:p.consciousness,note:consciousnessNote}),
    h('div',{className:'card'},h('div',{className:'sec',style:{marginTop:0}},'Round synthesis'),
      h('button',{className:'btn btn-outline btn-sm',disabled:busy,onClick:synth},busy?'Generating…':'Generate synthesis'),
      syn&&h('div',{style:{marginTop:8}},
        h('div',{className:'small'},h('b',null,'Doing things right. '),syn.doingThingsRight),
        h('div',{className:'small',style:{marginTop:6}},h('b',null,'Doing the right things. '),syn.doingTheRightThings),
        (syn.priorities||[]).length?h('div',{style:{marginTop:6}},h('div',{className:'small muted'},'Priorities'),(syn.priorities||[]).map((x,i)=>h('div',{key:i,className:'small'},'• '+x))):null))
  );
}

// =====================================================================
// Manage tab
// =====================================================================
function ManageTab({data,members,onReload}){
  const active=(data.rounds||[]).find(r=>r.status==='draft'||r.status==='open');
  const [label,setLabel]=useState('');
  const [carryFrom,setCarryFrom]=useState('');
  const [busy,setBusy]=useState('');
  const [msg,setMsg]=useState('');
  const closed=(data.rounds||[]).filter(r=>r.status==='closed');
  async function startRound(){setBusy('start');setMsg('');try{await api.post('/api/maturity/rounds',{label,carryFrom:carryFrom||undefined});setLabel('');await onReload();}catch(e){setMsg(e.message);}finally{setBusy('');}}
  async function act(path,label){setBusy(path);setMsg('');try{const r=await api.post('/api/maturity/rounds/'+active.id+'/'+path,{});if(r.configured===false)setMsg('Claude is not configured on the server.');else setMsg(label+' done.');await onReload();}catch(e){setMsg(e.message);}finally{setBusy('');}}
  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Assessment round'),
      msg&&h('div',{className:'alert alert-info'},msg),
      active?h('div',null,
        h('div',null,h('b',null,active.label),' ',h('span',{className:'pill pill-'+active.status},active.status)),
        h('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}},
          active.status==='draft'&&h('button',{className:'btn btn-outline btn-sm',disabled:busy,onClick:()=>act('suggest-descriptors','Descriptor suggestions')},busy==='suggest-descriptors'?'Asking Claude…':'Ask Claude to refresh level wording (all 16)'),
          active.status==='draft'&&h('button',{className:'btn btn-teal btn-sm',disabled:busy,onClick:()=>act('open','Open round')},'Open the round for assessment'),
          active.status==='open'&&h('button',{className:'btn btn-outline btn-sm',disabled:busy,onClick:()=>act('benchmark','Benchmark')},busy==='benchmark'?'Benchmarking…':'Run Claude benchmark (all 16)'),
          active.status==='open'&&h('button',{className:'btn btn-navy btn-sm',disabled:busy,onClick:()=>{if(confirm('Close this round? It becomes read-only and, if it has benchmarks, the comparison anchor.'))act('close','Close round');}},'Close the round')),
        active.status==='draft'&&h('div',{className:'small muted',style:{marginTop:6}},'Review the proposed wording per service from the Scorecard tab → open a service. Anything left pending is dropped when the round opens.')
      ):h('div',null,
        h('div',{className:'grid2'},
          h('input',{className:'form-input',placeholder:'Round label, e.g. 2026 H2',value:label,onChange:e=>setLabel(e.target.value)}),
          h('select',{className:'form-select',value:carryFrom,onChange:e=>setCarryFrom(e.target.value)},
            h('option',{value:''},'Start blank'),
            closed.map(r=>h('option',{key:r.id,value:r.id},'Carry answers from '+r.label)))),
        h('button',{className:'btn btn-teal btn-sm',disabled:busy||!label.trim(),onClick:startRound},'Start a draft round'))),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Closed rounds'),
      closed.length?closed.map(r=>h('div',{key:r.id,className:'line'},
        h('div',null,h('b',null,r.label),r.isAnchor&&h('span',{className:'chip chip-l3',style:{marginLeft:6}},'anchor'),
          h('div',{className:'small muted'},(r.closedAt||'').slice(0,10))),
        h('a',{className:'linkbtn',href:'/api/maturity/report/pdf?round='+r.id,target:'_blank'},'PDF'))):h('div',{className:'small muted'},'None yet.')),
    h('div',{className:'card'},
      h('div',{className:'sec',style:{marginTop:0}},'Roles'),
      members.map(m=>h('div',{key:m.id,style:{display:'flex',alignItems:'center',gap:10,padding:'6px 0',borderBottom:'0.5px solid var(--border)'}},
        h('span',{style:{flex:1}},m.name),
        h('select',{value:m.maturityRole||'member',onChange:async e=>{try{await api.put('/api/admin/members/'+m.id+'/app-role',{app:'maturity',role:e.target.value});onReload();}catch(err){alert(err.message);}}},
          ['admin','member','viewer'].map(r=>h('option',{key:r,value:r},r[0].toUpperCase()+r.slice(1)))))))
  );
}

// =====================================================================
// Shell
// =====================================================================
function MaturityApp({me,roles}){
  const [data,setData]=useState(null);
  const [err,setErr]=useState('');
  const [tab,setTab]=useState('scorecard');
  const [roundId,setRoundId]=useState('');
  const [openSvc,setOpenSvc]=useState(null);
  function load(rid){
    const q=rid||roundId;
    return api.get('/api/maturity/overview'+(q?('?round='+q):''))
      .then(d=>{setData(d);if(!roundId&&d.round)setRoundId(d.round.id);})
      .catch(e=>{if(e.code===401)location.href='/due-diligence?returnTo='+encodeURIComponent(location.pathname);else setErr(e.message);});
  }
  useEffect(()=>{window.__me=me.id;load();},[]);
  useEffect(()=>{if(roundId)load(roundId);},[roundId]);
  if(err)return h('div',{className:'page'},h('div',{className:'alert alert-danger'},err));
  if(!data)return h('div',{className:'page'},'Loading…');
  const TABS=[['assessment','Assessment'],['scorecard','Scorecard'],['progress','Progress']];
  if(roles.maturityAdmin)TABS.push(['manage','Manage']);
  return h('div',{className:'page'},
    h('div',{style:{marginBottom:12}},
      h('div',{style:{fontSize:18,fontWeight:700,color:'var(--navy)'}},'Maturity Assessment'),
      h('div',{className:'small muted'},'Robinson Family Office — is the family office getting more effective over time?'+(roles.maturityMember?'':' · read-only'))),
    h('div',{className:'tabs'},TABS.map(([k,l])=>h('div',{key:k,className:'tab'+(tab===k?' active':''),onClick:()=>setTab(k)},l))),
    tab==='assessment'&&h(AssessmentTab,{data,me,roles,onReload:()=>load(roundId)}),
    tab==='scorecard'&&h(ScorecardTab,{data,members:data.members,roles,roundId,onPickRound:setRoundId,onOpenService:setOpenSvc}),
    tab==='progress'&&h(ProgressTab,{roundId,consciousnessNote:data.consciousnessNote}),
    tab==='manage'&&roles.maturityAdmin&&h(ManageTab,{data,members:data.members,onReload:()=>load(roundId)}),
    openSvc&&h(ServiceDrawer,{serviceId:openSvc,roundId,members:data.members,roles,levelLabels:data.levelLabels,onClose:()=>setOpenSvc(null),onChanged:()=>load(roundId)})
  );
}

function Shell(){
  const [me,setMe]=useState(null);const [checking,setChecking]=useState(true);const [menu,setMenu]=useState(false);
  useEffect(()=>{api.get('/api/me').then(setMe).catch(()=>{location.href='/due-diligence?returnTo='+encodeURIComponent(location.pathname);}).finally(()=>setChecking(false));},[]);
  async function logout(){await api.post('/api/logout');location.href='/due-diligence';}
  if(checking||!me)return h('div',{style:{padding:40,textAlign:'center',color:'var(--muted)'}},'Loading…');
  const roles={maturityAdmin:me.maturityAdmin,maturityMember:me.maturityAdmin||me.maturityRole==='member',tasksMember:me.tasksAdmin||me.tasksRole==='member'};
  return h('div',null,
    h('nav',{className:'nav'},
      h('div',{className:'nav-brand'},h('a',{href:'/'},'Robinson Family Office'),h('span',null,'Maturity Assessment'),
        h('a',{href:'/risk',style:{color:'rgba(255,255,255,.75)',fontSize:11,marginLeft:14,textDecoration:'none'}},'Risk Management →')),
      h('div',{className:'nav-user',onClick:()=>setMenu(!menu)},me.name.split(' ')[0])),
    menu&&h('div',{style:{position:'fixed',top:56,right:16,background:'#fff',border:'0.5px solid var(--border)',borderRadius:10,padding:8,zIndex:400,minWidth:180,boxShadow:'0 4px 20px rgba(0,0,0,.12)'}},
      h('div',{style:{padding:'8px 10px',fontSize:13,fontWeight:600,color:'var(--navy)'}},me.name),
      h('div',{style:{padding:'0 10px 8px',fontSize:11,color:'var(--muted)'}},roles.maturityAdmin?'Maturity Admin':roles.maturityMember?'Maturity Member':'Read-only'),
      me.isAdmin&&h('a',{href:'/admin',style:{display:'block',borderTop:'0.5px solid var(--border)',padding:'8px 10px',fontSize:12,color:'var(--navy)',fontWeight:600,textDecoration:'none'}},'Manage Members'),
      h('div',{style:{padding:'8px 10px',cursor:'pointer',fontSize:12,color:'#991B1B',fontWeight:600},onClick:logout},'Sign out')),
    h(MaturityApp,{me,roles})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Shell));
</script>
</body>
